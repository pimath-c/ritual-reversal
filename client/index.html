<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Ritual Reversal — Protótipo v5.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Barlow+Condensed:wght@400;500;600;700&family=Big+Shoulders+Display:wght@400;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#a3203a; --crimson-hi:#e0435e; --violet:#6b3a8a; --gold:#d2ad62; --gold-hi:#f3d58e;
  --steel:#6d7e8e; --bronze:#8c6239; --iron:#15181c; --iron-2:#22272d;
  --bone:#e8e0d0; --muted:#a39b8e; --bg:#050506;
  --serif:'IM Fell English', Georgia, 'Times New Roman', serif;
  --cond:'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#050506; --bone:#e8e0d0; } }
:root.dalt{ --crimson:#2f5fa8; --crimson-hi:#6ea8ff; }
:root[data-theme="dark"]{ --bg:#050506; --bone:#e8e0d0; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ height:100%; margin:0; background:var(--bg); color:var(--bone); overflow:hidden; font-family:var(--cond); -webkit-font-smoothing:antialiased; }
#view{ position:fixed; inset:0; } #view canvas{ display:block; width:100%; height:100%; transition:filter .4s linear; }
#hud{ position:fixed; inset:0; pointer-events:none; display:none; } #hud.on{ display:block; }
/* Arsenal: a arma da primeira pessoa no meio da nave, o painel à direita */
body.arsenal #hud, body.arsenal #scr{ display:none!important; }
#arsenal{ position:fixed; top:0; right:0; bottom:0; width:min(400px,100vw); overflow:auto; z-index:40; padding:22px 20px 18px; box-sizing:border-box;
  background:linear-gradient(to right,rgba(5,5,6,0),rgba(5,5,6,.86) 14%,rgba(5,5,6,.94)); color:var(--bone); font-family:var(--sans,system-ui,sans-serif); }
#arsenal h2{ font-family:var(--serif,Georgia,serif); font-weight:400; font-size:30px; margin:0; color:var(--bone); letter-spacing:.02em; }
#arsenal .col{ color:var(--gold); font-size:13px; margin:2px 0 12px; } #arsenal .txt{ color:var(--muted); font-size:13px; line-height:1.45; margin:0 0 12px; }
#arsenal .abas{ display:flex; gap:6px; margin:0 0 12px; } #arsenal .abas button, #arsenal .acoes button{ flex:1; padding:8px 6px; background:rgba(255,255,255,.04); color:var(--bone); border:1px solid rgba(210,173,98,.35); border-radius:6px; cursor:pointer; font:inherit; font-size:13px; }
#arsenal .abas button.sel{ background:rgba(210,173,98,.18); border-color:var(--gold); color:var(--gold-hi); }
#arsenal .skin{ border:1px solid rgba(232,224,208,.14); border-radius:8px; padding:10px 12px; margin:0 0 8px; cursor:pointer; background:rgba(255,255,255,.02); }
#arsenal .skin.sel{ border-color:var(--gold); background:rgba(210,173,98,.08); } #arsenal .skin:hover{ border-color:rgba(210,173,98,.6); }
#arsenal .skin b{ font-family:var(--serif,Georgia,serif); font-weight:400; font-size:18px; } #arsenal .skin .of{ float:right; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:10px; border:1px solid currentColor; }
#arsenal .skin p{ margin:6px 0 0; font-size:12.5px; line-height:1.45; color:var(--muted); } #arsenal .skin.sel p{ color:#cfc6b6; }
#arsenal .acoes{ display:flex; flex-direction:row; align-items:stretch; flex-wrap:wrap; gap:6px; margin:10px 0 6px; } #arsenal .acoes button{ flex:1 1 30%; width:auto; }
#arsenal .rot{ color:var(--muted); font-size:12px; margin:10px 0 4px; } #arsenal .sair{ width:100%; margin-top:14px; }
@media (max-width:700px){ #arsenal{ top:auto; height:58vh; width:100vw; background:rgba(5,5,6,.92); } }
#hud{ left:env(safe-area-inset-left,0px); right:env(safe-area-inset-right,0px); } /* celular com entalhe: nada do HUD fica embaixo dele */
.plate{ background:linear-gradient(180deg, rgba(38,43,50,.84), rgba(18,21,25,.88)); border:1px solid rgba(140,98,57,.45);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px); }
#top{ position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:18px; padding:8px 22px; }
#top .side{ font-size:15px; color:var(--muted); min-width:130px; } #top .side b{ font-size:26px; color:var(--bone); font-weight:600; margin:0 6px; }
#regra{ font-size:11px; color:var(--muted); letter-spacing:.05em; margin-top:1px; } body.toque #regra{ display:none; }
#top .a{ text-align:right; }
#clock{ font-size:34px; font-weight:600; min-width:88px; text-align:center; line-height:1.05; }
#roundName{ font-family:var(--serif); font-size:15px; color:var(--gold); text-align:center; }
#clockWrap{ display:flex; flex-direction:column; align-items:center; }
#strip{ position:absolute; top:86px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
.pip{ width:64px; text-align:center; font-size:12px; color:var(--muted); }
.pip .gem{ width:26px; height:26px; margin:0 auto 3px; transform:rotate(45deg); border:1.5px solid #555c65; background:rgba(10,12,14,.7); display:grid; place-items:center; }
.pip .gem i{ transform:rotate(-45deg); font-style:normal; font-size:13px; font-weight:700; color:#7d858f; }
.pip.chosen .gem{ outline:1.5px solid var(--crimson-hi); outline-offset:3px; }
.pip.awake .gem{ border-color:#9b6fc0; background:rgba(107,58,138,.35); } .pip.awake .gem i{ color:#d6b8f0; }
.pip.confirmed .gem{ border-color:#c69cf0; background:rgba(107,58,138,.6); box-shadow:0 0 10px rgba(180,120,240,.6); } .pip.confirmed .gem i{ color:#fff; }
.pip.decoy .gem{ border-color:#6c6c6c; background:rgba(60,60,60,.4); } .pip.decoy .gem i{ color:#aaa; text-decoration:line-through; }
.pip.clean .gem i{ color:#4f5760; } .pip.seen .gem i{ color:#8a919a; } .pip.purged .gem{ border-color:#b08a3e; } .pip.purged .gem i{ color:#d8b46a; }
.pip.eco .gem{ outline:1.5px dashed var(--gold-hi); outline-offset:4px; animation:throb 1.6s ease-in-out infinite; }
.pip.active .gem{ border-color:var(--crimson-hi); background:rgba(163,32,58,.55); box-shadow:0 0 14px rgba(224,67,94,.8); animation:throb 1s ease-in-out infinite; } .pip.active .gem i{ color:#fff; }
.pip.fenda .gem{ border-color:#3a1b4a; background:#12071a; } .pip.fenda .gem i{ color:var(--crimson-hi); }
.pip.farol .gem{ border-color:var(--gold-hi); background:rgba(210,173,98,.45); } .pip.farol .gem i{ color:#fff; }
.pip .bar{ height:3px; background:#2a2f36; margin:3px 6px 0; } .pip .bar span{ display:block; height:100%; width:0; background:var(--crimson-hi); }
@keyframes throb{ 50%{ box-shadow:0 0 22px rgba(224,67,94,1); } }
@media (prefers-reduced-motion: reduce){ .pip.active .gem{ animation:none; } }
#feed{ position:absolute; top:16px; left:18px; width:350px; display:flex; flex-direction:column; gap:4px; }
#feed div{ font-size:16px; padding:5px 10px; background:rgba(8,9,11,.68); border-left:2px solid var(--steel); transition:opacity .6s; }
#feed div.c{ border-left-color:var(--crimson-hi); } #feed div.h{ border-left-color:var(--gold); } #feed div.big{ font-family:var(--serif); font-size:20px; }
#buffs{ position:absolute; top:182px; left:50%; transform:translateX(-50%); font-size:15px; text-align:center; color:var(--gold-hi); text-shadow:0 1px 2px #000; }
#cross{ position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; }
#agachadoChip{ position:absolute; left:50%; top:calc(50% + 58px); transform:translateX(-50%); font-size:12px; letter-spacing:.08em; color:#cfd6e2; opacity:0; transition:opacity .2s; text-shadow:0 1px 6px #000; pointer-events:none; }
#agachadoChip.on{ opacity:.72; }
#cross::before,#cross::after{ content:''; position:absolute; background:var(--mira,rgba(232,224,208,.85)); }
#cross.ponto::before,#cross.ponto::after{ display:none; } #cross.ponto i{ left:8px; top:8px; width:6px; height:6px; border-radius:50%; background:var(--mira,#e8e0d0); }
#cross.circulo::before,#cross.circulo::after{ display:none; } #cross.circulo i{ left:3px; top:3px; width:16px; height:16px; border-radius:50%; background:none; border:2px solid var(--mira,#e8e0d0); }
#cross::before{ left:10px; top:3px; width:2px; height:16px; } #cross::after{ top:10px; left:3px; height:2px; width:16px; }
#cross i{ position:absolute; left:8px; top:8px; width:6px; height:6px; background:var(--bg); }
#marks{ position:absolute; inset:0; overflow:hidden; }
.mk{ position:absolute; transform:translate(-50%,-100%); text-align:center; font-size:14px; line-height:1.15; white-space:nowrap; color:var(--bone); text-shadow:0 1px 2px #000,0 0 6px #000; }
.mk b{ display:block; width:9px; height:9px; margin:3px auto 0; transform:rotate(45deg); background:var(--gold); }
.mk.cult b{ background:var(--crimson-hi); }
.mk.caido{ color:var(--crimson-hi); font-weight:600; } .mk.caido b{ background:var(--crimson-hi); animation:throb 1s ease-in-out infinite; }
.mk.npc{ color:#e8d6a8; } .mk.npc b{ background:none; border:2px solid var(--gold); border-radius:50%; }
.mk.ping{ color:#8ee8ff; font-weight:600; } .mk.ping b{ width:11px; height:11px; background:none; border:2px solid #8ee8ff; animation:throb 1.2s ease-in-out infinite; }
.mk.obj{ color:#ff8fa3; } .mk.obj b{ width:12px; height:12px; background:none; border:2px solid var(--crimson-hi); }
.mk small{ display:block; color:var(--muted); font-size:12px; }
#dmgDir{ position:absolute; left:50%; top:50%; width:0; height:0; }
#dmgDir i{ position:absolute; left:-120px; top:-120px; width:240px; height:240px; border-radius:50%; border:5px solid transparent; border-top-color:rgba(230,40,60,.95);
  -webkit-mask:radial-gradient(circle, transparent 60%, #000 61%); filter:drop-shadow(0 0 6px rgba(230,40,60,.9)); transition:opacity 1.1s linear; }
#habNota{ position:absolute; left:50%; top:calc(50% + 62px); transform:translateX(-50%); font-family:var(--serif); font-size:21px; background:rgba(8,9,11,.8); padding:4px 14px; border-left:2px solid currentColor; text-shadow:0 1px 2px #000; opacity:0; transition:opacity .5s; white-space:nowrap; }
#habNota.on{ opacity:1; transition:none; }
/* frases rápidas */
#falas{ position:absolute; left:50%; top:calc(50% + 90px); transform:translateX(-50%); display:none; flex-direction:column; gap:3px; min-width:250px; padding:8px 10px; background:rgba(8,9,11,.86); border:1px solid rgba(232,224,208,.18); pointer-events:auto; }
#falas.on{ display:flex; } #falas small{ font-size:12px; color:var(--gold); letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px; }
#falas button{ text-align:left; font-family:var(--cond); font-size:16px; color:var(--bone); background:none; border:0; padding:3px 4px; cursor:pointer; } #falas button:hover,#falas button.sel{ color:var(--gold-hi); } #falas button.sel{ background:rgba(243,213,142,.1); }
#falas kbd{ font-family:var(--cond); font-weight:700; color:var(--gold-hi); border:1px solid #4a525c; padding:0 5px; margin-right:8px; }
/* caderno dos altares */
#chatJogo{ position:absolute; left:18px; top:76px; width:350px; display:none; z-index:6; } #chatJogo.on{ display:block; }
#chatJogo.todos input{ border-color:var(--crimson-hi); }
#chatJogo input{ width:100%; box-sizing:border-box; font:15px var(--sans,sans-serif); color:var(--bone); background:rgba(8,9,11,.92); border:1px solid var(--gold); padding:7px 10px; outline:none; }
#caderno{ position:absolute; right:26px; top:120px; width:360px; max-height:calc(100% - 300px); overflow:hidden; padding:10px 14px; background:rgba(8,9,11,.97); border:1px solid rgba(232,224,208,.16); display:none; pointer-events:none; z-index:6; }
#caderno.on{ display:block; } #caderno small{ display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
#caderno .cd{ padding:5px 0 6px; border-top:1px solid #262b31; } #caderno .cd b{ font-family:var(--serif); font-weight:400; font-size:17px; } #caderno .cd i{ font-style:normal; font-size:13px; font-weight:600; margin-left:8px; padding:0 6px; border:1px solid currentColor; }
#caderno .cd span{ display:block; font-size:13.5px; color:#cfc6b6; } #caderno .cd em{ display:block; font-style:normal; font-size:12.5px; color:var(--muted); margin-top:1px; }
#caderno .limpo i{ color:#7d858f; } #caderno .purgado i{ color:#d8b46a; } #caderno .desperto i{ color:#c69cf0; } #caderno .confirmado i{ color:#e0c8ff; } #caderno .chamariz i{ color:#aaa; } #caderno .ativo i,#caderno .fenda i{ color:var(--crimson-hi); } #caderno .farol i{ color:var(--gold-hi); } #caderno .nada i{ color:#5c636b; }
body.toque #caderno{ top:94px; right:12px; transform:scale(.72); transform-origin:top right; }
/* tutorial */
#tutorial{ position:absolute; left:26px; top:300px; width:330px; padding:10px 14px 12px; background:rgba(8,9,11,.85); border-left:3px solid var(--crimson-hi); display:none; pointer-events:none; }
#tutorial.on{ display:block; } #tutorial small{ display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--crimson-hi); }
#tutorial p{ margin:4px 0 6px; font-size:16px; line-height:1.4; color:#e6dccb; } #tutorial em{ font-style:normal; font-size:13px; color:var(--muted); }
#tutorial .barra{ height:3px; background:#2a2f36; margin-top:6px; } #tutorial .barra span{ display:block; height:100%; background:var(--crimson-hi); }
#tutorial.fim{ border-left-color:var(--gold-hi); } #tutorial.fim small{ color:var(--gold-hi); }
body.toque #tutorial{ top:auto; bottom:110px; width:250px; } body.toque #tutorial p{ font-size:12px; }
/* dicas da primeira noite */
#dica{ position:absolute; right:26px; top:340px; width:300px; padding:9px 14px 10px; font-size:15px; line-height:1.35; color:#ddd3c2; background:rgba(8,9,11,.82); border-left:2px solid var(--gold); opacity:0; transform:translateX(16px); transition:opacity .5s, transform .5s; pointer-events:none; }
#dica.on{ opacity:1; transform:none; } #dica small{ display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-bottom:2px; }
body.toque #dica{ top:auto; bottom:14px; right:auto; left:calc(50% - 150px); width:300px; font-size:12px; } /* no meio, embaixo: as tarefas ficam à esquerda */
/* bússola: direções e marcadores (aliados, rituais revelados, mercadores, sinalizadores) */
#bussola{ position:absolute; top:148px; left:50%; transform:translateX(-50%); width:440px; height:26px; overflow:hidden; pointer-events:none;
  -webkit-mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent); mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent); }
#bussola .tk{ position:absolute; top:0; width:1px; height:6px; background:rgba(232,224,208,.35); }
#bussola .ct{ position:absolute; top:6px; transform:translateX(-50%); font-size:13px; font-weight:600; color:#cfc6b6; text-shadow:0 1px 2px #000; }
#bussola .ct.n{ color:var(--crimson-hi); }
#bussola .bm{ position:absolute; top:3px; transform:translateX(-50%); font-size:12px; line-height:1; text-shadow:0 0 4px #000; }
#bussola .bm.al{ color:var(--gold-hi); } #bussola .bm.al.c{ color:#ff8fa3; } #bussola .bm.rit{ color:var(--crimson-hi); font-size:15px; top:1px; } #bussola .bm.npc{ color:#e8d6a8; } #bussola .bm.fl{ color:#ffb070; } #bussola .bm.cai{ color:var(--crimson-hi); }
#bussola .bm.ping{ color:#8ee8ff; font-size:15px; top:1px; }
#bussola::after{ content:''; position:absolute; left:50%; bottom:0; width:0; height:0; margin-left:-4px; border:4px solid transparent; border-bottom-color:var(--gold-hi); }
/* legendas sonoras: o que se ouve, de que lado e a que distância */
#legendas{ position:absolute; left:26px; bottom:172px; display:flex; flex-direction:column-reverse; align-items:flex-start; gap:3px; pointer-events:none; }
#legendas .lg{ font-size:15px; background:rgba(0,0,0,.58); padding:2px 12px 2px 8px; color:#ddd3c2; text-shadow:0 1px 2px #000; white-space:nowrap; transition:opacity .4s; display:flex; align-items:center; gap:7px; }
#legendas .lg svg{ width:12px; height:14px; fill:var(--gold-hi); flex:0 0 12px; }
#legendas .lg i{ display:inline-block; margin:0 2px; }
#legendas .lg i.aqui{ width:8px; height:8px; border:0; border-radius:50%; background:var(--gold-hi); }
#legendas .lg i.sem{ width:8px; height:8px; border:1px solid var(--gold-hi); border-radius:50%; background:none; }
#legendas .lg small{ color:var(--muted); font-size:13px; }
#legendas .lg.rit{ color:#ff9aab; } #legendas .lg.rit svg{ fill:var(--crimson-hi); } #legendas .lg.cult svg{ fill:#c58cff; } #legendas .lg.rit i.aqui,#legendas .lg.rit i.sem{ background:var(--crimson-hi); border-color:var(--crimson-hi); } #legendas .lg.perto{ color:#fff; }
#atordoado{ position:fixed; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at center, transparent 40%, rgba(230,190,90,.45) 100%); }
.tool.pulso{ animation:pulso .6s ease-out; } @keyframes pulso{ 0%{ box-shadow:0 0 0 0 rgba(243,213,142,.9); border-color:var(--gold-hi); } 100%{ box-shadow:0 0 0 14px rgba(243,213,142,0); } }
@media (prefers-reduced-motion: reduce){ .tool.pulso{ animation:none; } }
#ammoHint{ position:absolute; left:50%; top:calc(50% + 30px); transform:translateX(-50%); font-size:15px; color:var(--gold-hi); text-shadow:0 1px 2px #000; }
#hitmark.head{ border-color:var(--gold-hi); } #hitmark.kill{ border-color:var(--crimson-hi); border-width:3px; }
#hitmark.escudo{ border-color:#a8d4ff; border-style:dashed; } /* bloqueado pela armadura de osso: o golpe não passou */
#abate{ position:fixed; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(200,20,40,.5) 100%); }
#hitmark{ position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; opacity:0; border:2px solid #fff; transform:rotate(45deg) scale(.6); }
#interact{ position:absolute; left:50%; top:calc(50% + 46px); transform:translateX(-50%); text-align:center; display:none; }
#interact svg{ width:46px; height:46px; display:block; margin:0 auto 4px; }
#interact .lbl{ font-size:18px; background:rgba(8,9,11,.72); padding:3px 10px; margin-top:3px; }
#interact kbd{ font-family:var(--cond); font-weight:700; border:1px solid var(--gold); color:var(--gold); padding:0 5px; margin-right:6px; }
#race{ position:absolute; left:50%; bottom:128px; transform:translateX(-50%); width:440px; padding:10px 16px 12px; display:none; }
#race .t{ font-family:var(--serif); font-size:17px; text-align:center; margin-bottom:6px; }
#race .row{ display:grid; grid-template-columns:78px 1fr 44px; align-items:center; gap:8px; font-size:14px; margin-top:4px; }
#race .track{ height:10px; background:#101316; position:relative; border:1px solid #333a42; } #race .track span{ position:absolute; left:0; top:0; bottom:0; }
#race .rit .track span{ background:linear-gradient(90deg,#6b1224,var(--crimson-hi)); } #race .sel .track span{ background:linear-gradient(90deg,#7b5a24,var(--gold-hi)); }
#race .tick{ position:absolute; top:-3px; bottom:-3px; width:2px; background:rgba(232,224,208,.6); }
#race .note{ font-size:13px; color:var(--muted); text-align:center; margin-top:5px; min-height:16px; }
#vitals{ position:absolute; left:18px; bottom:18px; width:300px; padding:12px 16px; }
.meter{ margin-top:6px; } .meter .lab{ display:flex; justify-content:space-between; font-size:14px; color:var(--muted); } .meter .lab b{ color:var(--bone); font-size:18px; font-weight:600; }
.meter .trk{ height:8px; background:#0d0f12; border:1px solid #333a42; margin-top:2px; position:relative; } .meter .trk span{ display:block; height:100%; }
#hpFill{ background:linear-gradient(90deg,#5d6b77,#c9d3dc); } #shFill{ position:absolute; top:0; right:0; height:100%; background:rgba(200,120,255,.7); }
#sanFill{ background:linear-gradient(90deg,#43285a,#a77ad0); }

/* ================= v6.3: direção Nanquim =================
   Preto, osso e um único vermelho. Sem placas, sem degradês, sem cantos chanfrados: a hierarquia vem do tamanho
   (Big Shoulders Display nos títulos e números, IBM Plex Sans Condensed no corpo, IBM Plex Mono nos rótulos).
   Movimento só quando algo acontece (tiro, dano, feed, altar riscado, anúncio); "Clarões e tremor: reduzidos" e o

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
// v6.2: o mapa desta página. A página monta um mapa só e trocar de mapa recarrega: o escolhido no menu solo ou o da sala
// em que se entra (a sala tem o mapa de quem a criou). Precisa vir antes de qualquer leitura dos nomes do mapa no Sim.
const MAPA_BOOT=(()=>{ let m=null; try{ m=sessionStorage.getItem('rr-mapa-boot'); }catch(e){} if(!m) try{ m=JSON.parse(localStorage.getItem('rr-cfg')||'{}').mapa; }catch(e){} return Sim.IDS_MAPAS.includes(m)?m:'catedral'; })();
Sim.usarMapa(MAPA_BOOT);
const ASILO=MAPA_BOOT==='asilo';
const NOME_MAPA={catedral:'Catedral da Dor',asilo:'Asilo Blackwater'};
function recarregarNoMapa(id,sala){ try{ sessionStorage.setItem('rr-mapa-boot',id); if(sala) sessionStorage.setItem('rr-entrar-sala',JSON.stringify(sala)); else sessionStorage.removeItem('rr-entrar-sala'); }catch(e){} location.reload(); }
const {FEITICOS,FEIT_BY_TEAM,NPCS,ITENS,CFG,CLASSES,CLASS_BY_TEAM,HALF,CATEDRAL,SPAWN,CANDLES,WALLDEF,PILLARS,PEWS,BOX,TALL,segBox,clamp,lerp}=Sim;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const AUTOTEST=location.hash.startsWith('#autotest');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= ESTILO ILUSTRADO =================
// A luz passa a mudar em faixas, como numa ilustração; o brilho especular vira um reflexo recortado.
// Materiais com RIMLUZ ganham luz de recorte nas silhuetas (personagens).
(function estiloIlustrado(){
  const alvo='vec3 outgoingLight = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + reflectedLight.directSpecular + reflectedLight.indirectSpecular + totalEmissiveRadiance;';
  const novo=`vec3 albedoT = max( diffuseColor.rgb, vec3( 0.04 ) );
	vec3 luzT = ( reflectedLight.directDiffuse + reflectedLight.indirectDiffuse ) / albedoT;
	float liT = dot( luzT, vec3( 0.299, 0.587, 0.114 ) );
	float bT = 0.035;
	bT = mix( bT, 0.11, smoothstep( 0.03, 0.05, liT ) );
	bT = mix( bT, 0.26, smoothstep( 0.11, 0.15, liT ) );
	bT = mix( bT, 0.52, smoothstep( 0.30, 0.38, liT ) );
	bT = mix( bT, 0.95, smoothstep( 0.70, 0.85, liT ) );
	vec3 difT = luzT * ( bT / max( liT, 0.0001 ) ) * albedoT;
	vec3 espT = reflectedLight.directSpecular + reflectedLight.indirectSpecular;
	espT *= smoothstep( 0.06, 0.09, dot( espT, vec3( 0.333 ) ) ) * 1.15;
	vec3 outgoingLight = difT + espT + totalEmissiveRadiance;
	#ifdef RIMLUZ
		float rimT = pow( 1.0 - clamp( dot( normal, geometry.viewDir ), 0.0, 1.0 ), 2.5 );
		outgoingLight += RIMLUZ * smoothstep( 0.32, 0.5, rimT ) * 0.85;
	#endif`;
  for(const k of ['standard','physical']){ const sh=THREE.ShaderLib[k]; if(sh&&sh.fragmentShader.includes(alvo)) sh.fragmentShader=sh.fragmentShader.replace(alvo,novo); }
})();
// ================= PERFIL DO APARELHO =================
// A qualidade inicial vem do aparelho (celular, núcleos, memória); o jogador pode trocar nos Ajustes.
// Níveis: alto 3, medio 2, baixo 1, minimo 0. O que depende do nível na montagem da cena (texturas, partículas,
// árvores de fundo) vale ao recarregar; luzes, sombras, pós-processamento e resolução mudam na hora.
const TOQUE_DISP=(navigator.maxTouchPoints||0)>0&&(matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent));
const MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||TOQUE_DISP;
function qualAuto(){ const nc=navigator.hardwareConcurrency||4, mem=navigator.deviceMemory||4;
  if(MOBILE) return nc>=8&&mem>=8?'baixo':'minimo'; if(nc<=2||mem<=2) return 'baixo'; if(nc<=4||mem<=4) return 'medio'; return 'alto'; }
const QUAL0=(()=>{ try{ const q=JSON.parse(localStorage.getItem('rr-cfg')||'{}').qual; if(q) return q; }catch(e){} return qualAuto(); })();
const NIVEL={alto:3,medio:2,baixo:1,minimo:0}, nivelQ=q=>NIVEL[q]!=null?NIVEL[q]:3;
// No app Android (Capacitor) a página vem de dentro do aparelho: o servidor online é um endereço que o jogador digita.
const APP=!!window.RR_APP;
const PERF={nivel:nivelQ(QUAL0)}; PERF.leve=PERF.nivel<=1; PERF.minimo=PERF.nivel===0;
// luzes pontuais opcionais: cada uma diz a partir de que nível existe (cada luz acesa pesa em todos os pixels)
const LUZES_NIVEL=[]; let USAR_POS=true;
function nivelLuz(L,n){ L.userData.nivel=n; L.visible=n<=(PERF.nivelAtual!=null?PERF.nivelAtual:PERF.nivel); LUZES_NIVEL.push(L); return L; }
// ================= RENDERER =================
const renderer=new THREE.WebGLRenderer({antialias:PERF.nivel>=3&&!MOBILE,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.info.autoReset=false; let INFO_QUADRO={chamadas:0,triangulos:0};
renderer.shadowMap.enabled=PERF.nivel>=2; renderer.shadowMap.type=PERF.nivel>=3?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25; renderer.outputEncoding=THREE.sRGBEncoding;
$('#view').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05070c); scene.fog=new THREE.FogExp2(0x0b0d14,0.026);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,220); camera.rotation.order='YXZ'; scene.add(camera);
let composer=null, GRADE=null, BLOOM=null;
try{ composer=new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene,camera));
  BLOOM=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.55,0.72); composer.addPass(BLOOM); composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  // Etapa final: sombras puxadas para o azul-frio, luzes para o âmbar das velas, vinheta oval,
  // granulado de filme e aberração cromática nas bordas, que cresce quando a sanidade cai.
  for(const rt of [composer.renderTarget1,composer.renderTarget2]){ rt.depthTexture=new THREE.DepthTexture(); rt.depthTexture.type=THREE.UnsignedIntType; rt.depthBuffer=true; }
  GRADE=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},tDepth:{value:null},uTexel:{value:new THREE.Vector2(1/innerWidth,1/innerHeight)},uNear:{value:.05},uFar:{value:220},uTinta:{value:new THREE.Color(0x0c0610)},uTempo:{value:0},uAberr:{value:.0015},uVinheta:{value:.42},uGrao:{value:.045},uCamMundo:{value:new THREE.Matrix4()},uTan:{value:new THREE.Vector2(1,1)},uCat:{value:new THREE.Vector4(-96,-58,96,58)},uNevoaCor:{value:new THREE.Color(.075,.086,.09)},uNevoaDens:{value:.024},uT:{value:0}},
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:`uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform vec2 uTexel; uniform float uNear,uFar; uniform vec3 uTinta; uniform float uTempo,uAberr,uVinheta,uGrao;
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      uniform mat4 uCamMundo; uniform vec2 uTan; uniform vec4 uCat; uniform vec3 uNevoaCor; uniform float uNevoaDens,uT; varying vec2 vUv;
      float vr2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); float a=h(i),b=h(i+vec2(1,0)),c2=h(i+vec2(0,1)),d2=h(i+vec2(1,1)); return mix(mix(a,b,f.x),mix(c2,d2,f.x),f.y); }
      float lin(float d){ float z=d*2.0-1.0; return (2.0*uNear*uFar)/(uFar+uNear-z*(uFar-uNear)); }
      void main(){ vec2 c=vUv-.5; float r=length(c*vec2(1.25,1.0));
        vec2 d=c*uAberr*(1.0+r*6.0);
        vec3 col=vec3(texture2D(tDiffuse,vUv+d).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-d).b);
        float lum=dot(col,vec3(.2126,.7152,.0722));
        vec2 px=uTexel*1.4; float d0=lin(texture2D(tDepth,vUv).x);
        float dl=lin(texture2D(tDepth,vUv-vec2(px.x,0.)).x), dr=lin(texture2D(tDepth,vUv+vec2(px.x,0.)).x), du=lin(texture2D(tDepth,vUv+vec2(0.,px.y)).x), dd=lin(texture2D(tDepth,vUv-vec2(0.,px.y)).x);
        float salto=max(max(abs(dl-d0),abs(dr-d0)),max(abs(du-d0),abs(dd-d0)))/max(d0,.05);
        float i0=1.0/d0, dobra=abs(1.0/dl+1.0/dr+1.0/du+1.0/dd-4.0*i0)/i0;
        float borda=max(smoothstep(.1,.2,salto),smoothstep(.012,.03,dobra))*(1.0-smoothstep(28.0,60.0,d0));
        if(d0>uFar*.95) borda=smoothstep(.1,.2,salto);
        vec3 sombra=vec3(.9,.85,1.08), luz=vec3(1.1,.98,.86);
        col*=mix(sombra,luz,smoothstep(.08,.65,lum));
        col=mix(vec3(lum),col,1.22);
        col=(col-.5)*1.1+.5+.01;

// Funde o cenário estático: todas as peças opacas que usam o mesmo material viram um só objeto.
// Menos chamadas de desenho = mais quadros por segundo, principalmente em placa de vídeo modesta.
function fundirEstaticos(){
  if(!THREE.BufferGeometryUtils) return null;
  world.updateMatrixWorld(true);
  const grupos=new Map(), remover=[];
  world.traverse(o=>{ if(!o.isMesh||o===world) return; const mt=o.material; if(!mt||Array.isArray(mt)||mt.transparent) return;
    for(let q=o;q&&q!==world;q=q.parent) if(q.userData&&q.userData.dinamico) return;
    let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
    for(const k of Object.keys(g.attributes)) if(!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
    if(!g.attributes.uv) g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    if(!g.attributes.normal) g.computeVertexNormals();
    g.applyMatrix4(o.matrixWorld);
    g.computeBoundingSphere(); const cc=g.boundingSphere.center, chave=mt.uuid+'|'+Math.floor(cc.x/64)+'|'+Math.floor(cc.z/64); // uma malha por material e por região de 64 m: o que sai da tela é descartado inteiro
    if(!grupos.has(chave)) grupos.set(chave,{mt,geos:[],sombra:false}); const G=grupos.get(chave); G.geos.push(g); G.sombra=G.sombra||o.castShadow; remover.push(o); });
  for(const o of remover) o.parent.remove(o);
  let n=0; for(const G of grupos.values()){ const geo=THREE.BufferGeometryUtils.mergeBufferGeometries(G.geos,false); if(!geo) continue;
    const m=new THREE.Mesh(geo,G.mt); m.castShadow=G.sombra; m.receiveShadow=true; world.add(m); n++; }

function particulas(x,y,z,n,hex,vel,vida,grav,sobe){

// Tirar da cena não libera a memória da placa de vídeo: é preciso descartar geometrias e materiais.
// Texturas são compartilhadas entre muitos objetos e ficam; geometrias marcadas como compartilhadas também.
const COMPARTILHADAS=new Set();
function descartar(obj){ obj.traverse(o=>{ if(o.geometry&&!COMPARTILHADAS.has(o.geometry)) o.geometry.dispose();

const EFEITOS=[];
function efeito(obj,dur,fn){ world.add(obj); EFEITOS.push({obj,dur,t:0,fn}); }
function atualizarEfeitos(dt){ for(let i=EFEITOS.length-1;i>=0;i--){ const e=EFEITOS[i]; e.t+=dt; const k=Math.min(1,e.t/e.dur); e.fn(e.obj,k); if(k>=1){ world.remove(e.obj); descartar(e.obj); EFEITOS.splice(i,1); } } }

    if(P.tinha&&!R.has) fimReagente(P); else if(!P.tinha&&R.has){ P.cresce=0; P.k=0; }
    P.tinha=R.has; P.g.visible=R.has; if(!R.has) return;
    P.cresce=Math.min(1,P.cresce+dt/1.2); P.g.scale.setScalar(.05+.95*(1-Math.pow(1-P.cresce,3)));
    P.kAlvo=A?A.k:0; P.acao=A?A.acao:P.acao; P.k+=(P.kAlvo-P.k)*Math.min(1,dt*10); const k=P.k, col=P.acao==='col'?k:0, fogo=P.acao==='burn'?k:0;

    if(fogo>0&&Math.random()<dt*20*fogo) particulas(P.x+rand(-.2,.2),.3,P.z+rand(-.2,.2),1,0x4a4038,.6,1.4,-1.2,.3);
    if(fogo>0&&Math.random()<dt*3.5) tocar('estalo_fogo',{x:P.x,z:P.z,raio:22,vol:.5});
    if(col>.02&&!P.somCol){ P.somCol=true; tocar('folhas',{x:P.x,z:P.z,raio:18,vol:.5}); } else if(col<=.02) P.somCol=false;

    else if(t==='cinza'){ P.tampa.position.y=.3+col*.06; P.tampa.rotation.z=col*.5; if(col>.3&&Math.random()<dt*8) particulas(P.x,.35,P.z,1,0x8a8680,.3,1,-.3,.15); }

    else if(t==='flor') P.partes.forEach(p=>p.m.scale.setScalar(1-col*.75));
    else P.partes.forEach((p,j)=>{ p.m.rotation.z=p.r.z+Math.sin(agora*21+j)*.15*col; p.m.position.y=.22+col*.08; }); }); }

function dica(id){ if(SET.dicas===false||dicasVistas()[id]||DC.fila.includes(id)) return; DC.fila.push(id); }
function atualizarDicas(dt,m){ const el=$('#dica'); if(!el) return; DC.t-=dt; DC.aberta-=dt; if(DC.aberta<=0) el.classList.remove('on');

      if((V.momento||0)>=1&&V.altars.some(A=>A.chosen&&A.state==='awake')) dica('c_vigilia');

// ================= TRILHA DE TENSÃO =================
// O laço gravado tensao_laco (bordão grave e um chiado alto de vidro) cresce com o perigo: inimigo à vista e perto, ritual ao alcance do ouvido,
// sanidade baixa, ferimento recente, estar caído. Some durante o Grande Ritual (que tem a própria música).
const TN={k:0,au:null};
function tensaoSom(){ if(!AU.ok||TN.au) return; const out=AU.ctx.createGain(); out.gain.value=0; out.connect(AU.master); const src=lacoGravado('tensao_laco',out); if(!src) return; TN.au={out,src}; }
function atualizarTensao(dt,m){ let alvo=0;
  if(m&&V&&V.phase==='play'){ const P=camera.position;
    for(const a of V.actors){ if(a.team===m.team||a.hidden||a.st==='dead') continue; const x=a._rx!=null?a._rx:a.x, z=a._rz!=null?a._rz:a.z, d=Math.hypot(x-P.x,z-P.z); if(d<28&&Sim.segClear(P.x,P.z,x,z,0,Sim.TALL)) alvo=Math.max(alvo,.55+.4*(1-d/28)); }
    if([...LEG.keys()].some(k=>k.startsWith('rit'))) alvo=Math.max(alvo,.45);
    if(m.sanity<40) alvo=Math.max(alvo,.35+(40-m.sanity)/40*.4); if(hurtT>0) alvo=Math.max(alvo,.8); if(m.st==='down') alvo=1; if(m.st==='dead') alvo=0;
    alvo*=1-GR.k; }
  TN.k+=(alvo-TN.k)*Math.min(1,dt*(alvo>TN.k?2.5:.5)); if(TN.k>.02) tensaoSom(); if(TN.au) TN.au.out.gain.setTargetAtTime(.2*TN.k,AU.ctx.currentTime,.25); }

// ================= CADERNO DOS ALTARES =================

  V.altars.forEach((A,i)=>{ if(msg.includes(A.name)) CAD.notas[i]={msg,rt:V.rt||0}; }); }
function estadoCaderno(A,i,papel){

    return {'?':['Sem pistas','Nada se sabe ainda: santuários, sentinelas e o sensor ajudam','nada'],

      chamariz:['Chamariz','Sem resíduo: é isca. Não perca tempo aqui','chamariz'],ativo:['Ritual!','Ritual em andamento: vá selar','ativo']}[k]||['?','','nada']; }
  if(A.state==='active') return ['Ritual',`Seu ritual está em ${Math.floor(A.prog*100)}%${A.localized?', e os Caçadores sabem onde':''}`,'ativo'];
  if(A.decoy) return ['Chamariz','Isca plantada: atrai os Caçadores','chamariz'];

  return ['Fora do plano','Não é um dos altares escolhidos','limpo']; }
function atualizarCaderno(){ const el=$('#caderno'); if(!el) return; if(!CAD.aberto||!V||V.phase!=='play'){ if(el.classList.contains('on')) el.classList.remove('on'); return; }

// ================= PING DE EQUIPE =================
// Marca o que está na mira para a própria equipe: um inimigo à vista, um altar ou um ponto no chão (até a parede).
const PINGS=[]; let pingN=0;
function fazerPing(){ const m=me(); if(!m||!V||V.phase!=='play'||m.st==='dead') return;
  const P=camera.position, cy=Math.cos(LOOK.pitch), D={x:-Math.sin(LOOK.yaw)*cy,y:Math.sin(LOOK.pitch),z:-Math.cos(LOOK.yaw)*cy};
  const mira=(x,y,z,max,cos)=>{ const dx=x-P.x,dy=y-P.y,dz=z-P.z,d=Math.hypot(dx,dy,dz); return d<max&&d>.5&&(dx*D.x+dy*D.y+dz*D.z)/d>cos?d:null; };
  let alvo=null, bd=1e9;
  for(const a of V.actors){ if(a.team===m.team||a.hidden||a.st==='dead') continue; const x=a._rx!=null?a._rx:a.x, z=a._rz!=null?a._rz:a.z, d=mira(x,a.st==='down'?.4:1.2,z,75,.994);
    if(d!=null&&d<bd&&Sim.segClear(P.x,P.z,x,z,0,Sim.TALL)){ bd=d; alvo={k:'inimigo',x,z,i:-1}; } }
  if(!alvo) for(const A of V.altars){ const d=mira(A.x,1,A.z,95,.985); if(d!=null&&d<bd){ bd=d; alvo={k:'altar',x:A.x,z:A.z,i:A.i}; } }
  if(!alvo){ let h=D.y<-.01?Math.min(60,P.y/-D.y*cy):60; const ux=D.x/Math.max(cy,1e-3), uz=D.z/Math.max(cy,1e-3);
    if(!Sim.segClear(P.x,P.z,P.x+ux*h,P.z+uz*h,0,Sim.TALL)){ let a=0,b=h; for(let k=0;k<12;k++){ const c=(a+b)/2; if(Sim.segClear(P.x,P.z,P.x+ux*c,P.z+uz*c,0,Sim.TALL)) a=c; else b=c; } h=Math.max(0,a-.4); }
    alvo={k:'ponto',x:P.x+ux*h,z:P.z+uz*h,i:-1}; }
  sendAct({type:'ping',x:+alvo.x.toFixed(2),z:+alvo.z.toFixed(2),k:alvo.k,i:alvo.i}); }
// frases rápidas: V abre a lista, 1 a 6 escolhe (ou clique); só a própria equipe ouve

function textoFala(f,team){ return f===5?FALA6[team]||FALA6.H:FALAS[f]||''; }

// reanimação, avisa quando inicia um ritual e, no jogo local, quando avista um inimigo longe de você

// ================= ESPECTADOR =================
// Caído: a câmera vira para quem te derrubou. Morto: a câmera acompanha um aliado de pé (o botão de atacar troca),
// ou gira devagar sobre o lugar onde você caiu se não houver nenhum.
const ESP={prev:'alive',golpe:null,quem:'',alvo:null,idx:0,pos:null,cliqueAntes:false,virar:null,nAliados:0,ang:0};
function registrarQueda(m){ const G=ESP.golpe; ESP.quem=''; marcoLT(m.st==='down'?'queda':'morte',m.st==='down'?'Você caiu':'Você morreu');
  if(G&&performance.now()-G.t<4000){ const a=V.actors.find(b=>b.id===G.s);
    if(a){ const C=CLASSES[a.cls]||{}, d=Math.round(Math.hypot(G.x-m.x,G.z-m.z)), arma=C.arma||'';
      ESP.quem=`Derrubado por <b style="color:${a.team==='H'?'var(--gold-hi)':'var(--crimson-hi)'}">${esc(a.name)}</b> (${esc(C.name||'')}${arma?', '+esc(arma.toLowerCase()):''}) a ${d} m`;
      if(m.st==='down'){ const dx=G.x-m.x, dz=G.z-m.z; ESP.virar={yaw:Math.atan2(-dx,-dz),t:.7}; } } }
  if(!ESP.quem&&m.st==='dead') ESP.quem='Você sangrou até o fim'; }
function viraParaGolpe(m,dt){ const v=ESP.virar; if(!v) return; if(m.st!=='down'){ ESP.virar=null; return; } v.t-=dt;
  let d=v.yaw-LOOK.yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); LOOK.yaw+=d*Math.min(1,dt*7); if(v.t<=0||Math.abs(d)<.02) ESP.virar=null; }
function espectar(m,dt){
  const al=V.actors.filter(a=>a.team===m.team&&a.cid!==meCid&&a.st!=='dead'&&!a.hidden); ESP.nAliados=al.length;
  const clique=mouseL&&locked; if(clique&&!ESP.cliqueAntes&&al.length) ESP.idx=(ESP.idx+1)%al.length; ESP.cliqueAntes=clique;
  const a=al.length?al[ESP.idx%al.length]:null; ESP.alvo=a;
  let ax,az,ay,cx,cy,cz;
  if(a){ ax=a._rx!=null?a._rx:a.x; az=a._rz!=null?a._rz:a.z; ay=a.st==='down'?.5:1.45; const yaw=a._ryaw!=null?a._ryaw:a.yaw;
    let d=3.4; const bx=Math.sin(yaw), bz=Math.cos(yaw); while(d>.9&&!Sim.segClear(ax,az,ax+bx*d,az+bz*d,.3,Sim.BOX)) d-=.35;
    cx=ax+bx*d; cz=az+bz*d; cy=ay+.9; }
  else { ESP.ang+=dt*.25; ax=m.x; az=m.z; ay=.3; cx=ax+Math.cos(ESP.ang)*5; cz=az+Math.sin(ESP.ang)*5; cy=4.2; }
  const alvoP=new THREE.Vector3(cx,cy,cz); if(!ESP.pos||ESP.pos.distanceTo(alvoP)>40) ESP.pos=alvoP.clone();
  ESP.pos.lerp(alvoP,1-Math.exp(-dt*6)); camera.position.copy(ESP.pos); camera.lookAt(ax,ay,az); }

const CONQ=[['primeira','Primeira noite','Termine uma partida.'],['vitoria','Amanhecer','Vença uma partida.'],['fenda','Fenda aberta','Complete um ritual como Cultista.'],
  ['farol','Farol','Sele um ritual como Caçador.'],['doisazero','Dois a zero','Como Cultistas, abra duas Fendas sem deixar selar nenhum ritual.'],['muralha','Muralha de fé','Como Caçadores, sele dois rituais na mesma rodada.'],
  ['anjo','Anjo da guarda','Reanime 3 aliados numa partida.'],['mao','Mão pesada','Derrube 5 inimigos numa partida.'],['purificador','Purificador','Purgue 3 altares numa partida.'],
  ['ilusionista','Ilusionista','Plante um Chamariz.'],['andarilho','Andarilho','Transfira um ritual.'],['intocado','Intocado','Passe uma rodada inteira sem cair.'],
  ['tempestade','Sob a tempestade','Jogue uma rodada sob tempestade.'],['classes','Todas as máscaras','Jogue com todas as cinco classes.'],['veterano','Veterano','Termine 10 partidas.'],['aprendiz','Aprendiz','Termine o tutorial.'],['desafio','Noite marcada','Termine um desafio da noite.'],['online','Em boa companhia','Termine uma partida online.']];
function perfil(){ let p=null; try{ p=JSON.parse(localStorage.getItem('rr-perfil')||'null'); }catch(e){}
  return Object.assign({partidas:0,vitorias:0,derrotas:0,empates:0,papel:{H:{rodadas:0,vitorias:0},C:{rodadas:0,vitorias:0}},classes:{},recordes:{},conq:{},hist:[],ids:[]},p||{}); }
function salvarPerfil(p){ try{ localStorage.setItem('rr-perfil',JSON.stringify(p)); }catch(e){} }
const PF={desde:0,id:null,fila:[],toastT:0};
function perfilFim(){ if(!V||V.phase!=='final') return; const id=(V.matchId||'')+'|'+meCid; if(PF.id===id) return;
  if(MODE==='online'&&!LT.logOnline){ if(!PF.desde) PF.desde=performance.now(); if(performance.now()-PF.desde<4000) return; }
  PF.id=id; PF.desde=0; const p=perfil(); if(p.ids.includes(id)) return; p.ids.push(id); if(p.ids.length>60) p.ids.shift();
  const slot=mySlot(); if(!slot) return; const w=Sim.winner(V)||{win:null}, venceu=w.win===slot.team, empate=w.win==null, eu=me()||{};
  p.partidas++; if(empate) p.empates++; else if(venceu) p.vitorias++; else p.derrotas++;
  const meu=eu.name||(LT.rod[1]&&LT.rod[1].nome)||'', log=logDaNoite()||[], conta=(ev,campo,r)=>log.filter(e=>e.ev===ev&&e[campo]===meu&&(r==null||e.r===r)).length;
  const novas=[]; const ganha=k=>{ if(!p.conq[k]){ p.conq[k]=Date.now(); novas.push(k); } };
  const linha={data:Date.now(),modo:MODE,resultado:empate?'empate':venceu?'vitória':'derrota',rodadas:[]};
  for(const r of [1,2]){ const R=LT.rod[r]; if(!R||!R.papel) continue; const papel=R.papel, sc=papel==='C'?V.scores[slot.team]:V.scores[slot.team==='A'?'B':'A'];
    const ganhouRodada=papel==='C'?(sc&&sc.done>=2):(sc&&sc.done<2);
    p.papel[papel].rodadas++; if(ganhouRodada) p.papel[papel].vitorias++;
    const C=p.classes[R.cls]||(p.classes[R.cls]={rodadas:0,vitorias:0}); C.rodadas++; if(ganhouRodada) C.vitorias++;
    linha.rodadas.push({papel,cls:R.cls,fendas:sc?sc.done:0,farois:sc?sc.sealed:0,clima:climaDe(chaveClima()+':'+r)});
    if(papel==='C'&&sc&&sc.done>=1) ganha('fenda'); if(papel==='C'&&sc&&sc.done>=2&&!sc.sealed) ganha('doisazero');
    if(papel==='H'&&sc&&sc.sealed>=1) ganha('farol'); if(papel==='H'&&sc&&sc.sealed>=2) ganha('muralha');
    if(log.length&&!log.some(e=>e.ev==='down'&&e.who===meu&&e.r===r)) ganha('intocado');
    if(climaDe(chaveClima()+':'+r)==='tempestade') ganha('tempestade'); }
  const n={quedas:conta('down','by'),reanimacoes:conta('revive','by'),purgas:conta('purge','by'),rituais:conta('ritual_start','by'),tarefas:conta('ponto','by')};
  for(const k in n) if(n[k]>(p.recordes[k]||0)) p.recordes[k]=n[k];
  Object.assign(linha,n);
  ganha('primeira'); if(venceu) ganha('vitoria'); if(n.reanimacoes>=3) ganha('anjo'); if(n.quedas>=5) ganha('mao'); if(n.purgas>=3) ganha('purificador');
  if(conta('decoy','by')) ganha('ilusionista'); if(conta('transfer','by')) ganha('andarilho'); if(MODE==='online') ganha('online');
  if(p.partidas>=10) ganha('veterano'); if(Object.keys(CLASSES).every(c=>p.classes[c])) ganha('classes');
  p.hist.unshift(linha); p.hist=p.hist.slice(0,20); salvarPerfil(p);
  for(const k of novas){ const c=CONQ.find(q=>q[0]===k); if(c) PF.fila.push(c); } }
function atualizarToast(dt){ const el=$('#conquista'); if(!el) return; PF.toastT-=dt;
  if(PF.toastT<=0){ el.classList.remove('on'); if(PF.fila.length&&PF.toastT<-.6){ const c=PF.fila.shift(); el.innerHTML=`<small>Conquista</small><b>${esc(c[1])}</b><span>${esc(c[2])}</span>`; el.classList.add('on'); PF.toastT=4.5; SFX.sealed(); } } }

  const rec=[['quedas','Inimigos derrubados'],['reanimacoes','Aliados reanimados'],['purgas','Altares purgados'],['rituais','Rituais iniciados'],['tarefas','Tarefas cumpridas']].map(([k,l])=>`<tr><td>${l}</td><td class="n">${p.recordes[k]||0}</td></tr>`).join('');

      <h3>Classes</h3><table class="res"><tr><th></th><th class="n">Rodadas</th><th class="n">Vencidas</th></tr>${cls}</table></div>
    <div><h3>Recordes numa partida</h3><table class="res">${rec}</table>${hist?`<h3>Últimas partidas</h3><table class="res">${hist}</table>`:''}</div></div>
    <h3>Conquistas</h3><div class="conqs">${cq}</div>
    <div class="btnrow"><button class="go ghost" id="bZerar">Apagar perfil</button><button class="go" id="bPerfOk">Voltar</button></div>`,
  ()=>{ $('#bPerfOk').onclick=()=>{ perfilAberto=false; screenKey=''; }; $('#bZerar').onclick=()=>{ if(confirm('Apagar todo o histórico e as conquistas?')){ try{ localStorage.removeItem('rr-perfil'); }catch(e){} screenKey=''; } }; }); }

function labMudancas(lab){ const L=Sim.labDe(lab), P=Sim.labDe(); return LAB_UI.filter(([k])=>L[k]!==P[k]).map(([k,nome,ops])=>`${nome}: ${ops.find(o=>o[0]===L[k])[1]}`); }

function ligarLab(muda){ const d=scrBody.querySelector('details.lab'); if(d) d.ontoggle=()=>{ SET.labAberto=d.open; saveSet(); };
  if(!muda) return; const atual=()=>{ const L=Sim.labDe(MODE==='online'&&NET.lobby?NET.lobby.lab:SET.lab), o={}; LAB_UI.forEach(([k])=>o[k]=L[k]); return o; };

// Números da noite que respondem "a investigação funciona?" e as perguntas para quem jogou. Baixa tudo num JSON
// (com o registro inteiro) ou copia como texto para mandar no grupo. As respostas ficam guardadas neste aparelho.
const REL={aberto:false};
const PERGUNTAS_PLAYTEST=['Em que momento você sentiu que estava investigando de verdade?','Em que momento sentiu que estava só correndo de um lugar a outro?',
  'Qual informação mudou a sua decisão?','Quando você sentiu que não tinha como responder ao adversário?','Qual mecânica você tiraria do jogo?','Você jogaria mais uma partida? Por quê?'];
const CAUSA_SELO={'caído':'caiu','empurrão':'Empurrão','atordoado':'atordoado','saiu':'saiu do círculo','soltou':'soltou o E','lutar':'parou para lutar'};
// v5.7: o que cada lado fez no círculo (a menos de 12 m, depois que a caça chegou)
function textoDisputa(R){ const D=R.disputa; if(!D) return ''; const H=D.caca, C=D.culto, n=v=>Math.round(v||0), i=R.interrupcoes||{};
  return `Caça: ${n(H.selando)} s selando (${n(H.sobFogo)} s sob fogo), ${n(H.atacando)} s atirando, ${n(H.dano)} de dano, ${H.quedas||0} ${H.quedas===1?'queda':'quedas'}. `+
    `Culto: ${n(C.canal)} s canalizando, ${n(C.atacando)} s atacando, ${n(C.dano)} de dano, ${C.quedas||0} ${C.quedas===1?'queda':'quedas'}. `+
    `Interrupções: ${i.selo||0} de selo, ${i.canal||0} de canalização.`; }
const CACA_TXT={selou:'Selou',perdeu_disputa:'Chegou a tempo e perdeu o círculo',chegou_tarde:'Chegou tarde demais',perto_sem_entrar:'Chegou perto e não entrou',altar_errado:'Foi a outro altar e não chegou',nunca_chegou:'Nunca chegou perto',aberto:'A noite acabou antes'};
const COMO_DESCOBRIU={evp:'EVP',sentinela:'sentinela',lanterna:'Lanterna',rastro_lido:'marcas de arrasto',localized:'o coro revelou o ritual'};
function respostasPlaytest(){ try{ return JSON.parse(localStorage.getItem('rr-resp-'+V.matchId)||'[]'); }catch(e){ return []; } }
function guardarRespostas(r){ try{ localStorage.setItem('rr-resp-'+V.matchId,JSON.stringify(r)); }catch(e){} }

    vencedor:Sim.winner(V),jogadores:V.slots.map(s=>({nome:s.name,equipe:s.team,humano:!!s.cid})),

function textoRelatorio(D){ const L=[`Ritual Reversal v${Sim.VERSAO} · relatório do playtest · partida ${D.partida}`,`Regras: ${D.mudancas.length?D.mudancas.join(' · '):'normais'}`,`Resultado: ${D.vencedor?D.vencedor.why:'—'}`];
  for(const M of D.metricas){ const I=M.investigacao, E=M.engano, C=M.combate, S=M.selamento;
    L.push('',`Rodada ${M.rodada}: ${M.fendas} Fendas, ${M.farois} Faróis, ${fmt(M.duracao)} de noite`,
      `Investigação: primeira verdade aos ${I.primeiraVerdade!=null?fmt(I.primeiraVerdade):'—'} (${COMO_DESCOBRIU[I.comoDescobriu]||'—'}), ${I.pistasNovas} pistas novas, maior trecho sem pista ${fmt(I.maiorIntervaloSemPista)}`,
      `Engano: ${E.chamarizes} Chamarizes (${E.chamarizesDesmascarados} desmascarados, ${E.chamarizesQueimados} queimados), ${E.transferencias} Transferências, ${E.purgasDeAltarVerdadeiro} purgas de altar verdadeiro`,
      ...M.rituais.map(R=>`Ritual em ${R.altar} (${fmt(R.inicio)}): localizado após ${R.localizado!=null?Math.round(R.localizado)+' s':'—'}, caça chegou após ${R.chegada!=null?Math.round(R.chegada)+' s':'—'}, ${R.tentativasSelo} tentativas de selo, ${R.resultado}${R.disputa?'. '+textoDisputa(R):''}`),
      ...(M.lances||[]).filter(x=>LANCE_TXT[x.tipo]).map(x=>`Lance (${fmt(x.t)}): ${LANCE_TXT[x.tipo](Object.assign({},x,{nome:x.altar})).join(': ')}`),
      `Selamento: ${S.tentativas} tentativas, ${S.selados} selados, interrupções: ${Object.entries(S.interrupcoes).map(([k,v])=>`${CAUSA_SELO[k]||k} ${v}`).join(', ')||'nenhuma'}`,
      `Combate: ${C.quedas} quedas, ${C.execucoes} execuções, ${C.sangraram} sangraram, ${C.reanimacoes} reanimações, primeira queda ${C.primeiraQueda!=null?fmt(C.primeiraQueda):'—'}`); }
  const R=D.respostas.filter(x=>x.resposta.trim()); if(R.length){ L.push('','Respostas:'); R.forEach(x=>L.push(`- ${x.pergunta} ${x.resposta.trim()}`)); }
  return L.join('\n'); }
function relatorioScreen(){ const log=logDaNoite();

async function salvarArquivo(name,data,msg){
  try{ if(window.claude&&window.claude.use){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:name,data}); msg.textContent='Arquivo salvo.'; return; } } }
  catch(e){ if(e&&e.code==='declined'){ msg.textContent='Download cancelado.'; return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); msg.textContent='Arquivo salvo.'; }
async function downloadLog(){
  const msg=$('#logMsg');
  if(MODE==='online'&&NET.logUrl){ const a=document.createElement('a'); a.href=NET.logUrl; a.download=''; document.body.appendChild(a); a.click(); a.remove(); msg.textContent='O servidor também guarda uma cópia na pasta logs.'; return; }
  // dificuldade, regras do laboratório e papel vão junto: sem eles, um registro de playtest não diz contra quem se jogou
  const data=JSON.stringify({versao:Sim.VERSAO,registro:Sim.REGISTRO,match:game.matchId,dificuldade:(game.opts&&game.opts.dificuldade)||'normal',lab:game.lab,papel:myRole(),slots:game.slots,scores:game.scores,stats:game.stats,events:game.log},null,1), name=`ritual-reversal-${game.matchId}.json`;
  try{ if(window.claude&&window.claude.use){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:name,data}); msg.textContent='Registro salvo.'; return; } } }
  catch(e){ if(e&&e.code==='declined'){ msg.textContent='Download cancelado.'; return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); msg.textContent='Registro salvo.';
}

const NOVIDADES=[['Bonecos e armas de verdade (v6.5)','Os Caçadores e os Cultistas agora são personagens modelados (CC0, Quaternius): Ritualista e Guardião de capuz vermelho, Soldado e Exorcista de casaco e chapéu, a Rastreadora de couro marrom. A carabina de alavanca e o revólver também são modelos de verdade, com as mesmas skins. As animações continuam as mesmas.'],['Cadeira, balcão e portas (v6.4e)','A cadeira do Eletrochoque é uma cadeira gótica de madeira entalhada, o balcão do Saguão é uma fileira de armários brancos descascados e as portas do Asilo são de tábuas pintadas e gastas.'],['Pinturas e espelhos (v6.4d)','O Asilo ganhou pinturas emolduradas e espelhos entalhados nas paredes de 29 salas, e os lampiões das mesas agora têm o vidro pintado e o metal dourado.'],['Mais duas levas de arte (v6.4c)','As samambaias da mata, as raízes do carvalho, os bancos da nave e a arca agora são modelos escaneados, e as rochas têm três formas. O promontório ganhou chão de terra e capim ralo, e as pilhas de madeira, tábuas gastas. No Asilo, luminárias industriais, quadros de força, canteiros de madeira na horta, bancadas e macas de verdade, lampiões nas mesas, e telhados de ardósia, ferro enferrujado e concreto fotografados.'],['Mais arte de verdade (v6.4b)','As árvores da mata ganharam casca fotografada; ruínas, pilares, menires e muretas viraram pedra bruta; os telhados da catedral, ardósia; as lápides, pedra gasta. A fogueira do acampamento tem um anel de pedras escaneado, os postes ganharam lanternas de madeira e os escombros são pilhas de pedras com musgo.'],
  ['Texturas e modelos de verdade (v6.4)','As texturas feitas por código viraram fotos escaneadas (CC0, Poly Haven): pedra, madeira, mármore, folhas da mata e, no Asilo, reboco, azulejo e ladrilho. Rochas, troncos, caixotes, camas de ferro, bancos e mesas agora são modelos 3D escaneados. A colisão não mudou. No laboratório, "Entre rituais" troca a espera pela Hora Morta por uma pausa curta depois de cada ritual.'],
  ['Correções (v6.3b)','As portas largas do Asilo não têm mais uma fresta para o céu em cima. Jogo e servidor de versões diferentes não trocam mais o mapa: o jogo monta o mapa da sala, um jogo antigo não entra numa sala do Asilo e o chat da sala avisa quando as versões não batem. Os nomes compridos na faixa dos altares não se sobrepõem mais.'],
  ['Só sons gravados (v6.2b)','Os bipes, o vento de ruído, a música do menu, a trilha de tensão e a pulsação dos rituais eram sintetizados na hora. Agora tudo sai de gravações reais (CC0): cliques, sensor, coração, tambor, presságio, trovão, a música do menu no coro gravado. Nenhum som do jogo é feito por IA.'],
  ['Asilo Blackwater (v6.2)','Mapa novo: um sanatório na margem de um lago, com duas alas, seis altares e o coreto no gramado. Portas que se abrem e fecham (segure E): fechadas, bloqueiam passagem, tiros e visão e abafam o som. Um quadro de força por ala: o culto corta a luz, a caça religa, e sem ninguém ela volta em 90 s. Escolha o mapa no título.'],
  ['Culto que se defende (v6.1)','Do primeiro playtest com duas pessoas: os Cultistas controlados pelo jogo, canalizando, só reagiam a quem chegava a 8 m, e uma dupla de Caçadores derrubava o culto de longe sem levar um tiro. Agora quem canaliza revida quem o acertou e quem chega a 20 m (atacar ainda pausa a canalização).'],
  ['Catedral e desfiladeiro (v6)','O mapa foi refeito em duas regiões: a catedral em cruz no alto do promontório e a mata ao sul, separadas por um desfiladeiro com três travessias (a Ponte Grande, a árvore caída e o aqueduto). Cada parte da mata tem o seu reagente.'],
  ['Cobertura e agachar (v6)','Túmulos, muretas e pedras baixas agora param tiros e sigilos abaixo da altura deles. Agachado (C, ou o botão B do controle) você anda na metade da velocidade, com passos que só se ouvem a 5 m, e fica mais baixo atrás da cobertura.'],
  ['Execução, reagentes e velas (v6)','Executar alguém tem pose, tremor e um fecho que todos por perto veem; quem está sendo executado vê o mundo fechar. Os reagentes têm forma e respondem à coleta. Oito velas em cada altar contam o ritual: vermelho-escuro é progresso que não volta.'],
  ['Arsenal (v6)','No menu, o Arsenal mostra as armas de perto e a coleção Relíquias da Vigília: três acabamentos por arma (Ofício, Mestre e Relíquia), todos livres, só aparência. Cada arma tem uma inspeção nova (tecla I).'],
  ['Mãos de verdade (v5.9)','As armas agora são seguradas por mãos com dedos e braços que se dobram. A carabina recarrega cartucho por cartucho pela portinhola (e aciona a alavanca quando estava vazia); o revólver abre o tambor, ejeta as cápsulas e usa um municiador de oito.'],
  ['Sacar, inspecionar, gesticular','Cada arma tem seu jeito de sacar (a alavanca, a bênção na cruz do revólver, as vértebras do cetro acendendo). Tecla I inspeciona a arma; as habilidades têm um gesto da mão livre.'],
  ['Do primeiro playtest (v5.8b)','Salvar um ritual que chegou a 85% ou mais vira o lance "Selo no último instante", mesmo que o progresso recue enquanto você sela. A loja não cobra munição com a reserva cheia. O registro baixado diz a dificuldade dos bots.'],
  ['Sons gravados','Tiros, impactos, passos por chão, sino, corvos, coro e o ritual inteiro agora usam gravações reais de bibliotecas abertas, com variação a cada vez. Créditos em Ajustes.'],

    const blur=s<40?(40-s)/40*1.1:0; // filtro CSS sobre o canvas custa caro em GPU fraca: só nos níveis médio e alto
    renderer.domElement.style.filter=PERF.nivelAtual>=2&&k>.01?`saturate(${(1-k*.55).toFixed(2)}) contrast(${(1+k*.25).toFixed(2)})${blur>.05?` blur(${blur.toFixed(2)}px)`:''}`:'';
    if(s<40){ hallT-=dt; if(hallT<=0){ hallT=rand(6,12); const a=rand(0,Math.PI*2); if(Math.random()<.25&&SFX.assombro(pos.x+Math.cos(a)*9,pos.z+Math.sin(a)*9)){} else if(Math.random()<.5) SFX.whisper(pos.x+Math.cos(a)*6,pos.z+Math.sin(a)*6); else tocar('alucinacao',{x:pos.x+Math.cos(a)*5,z:pos.z+Math.sin(a)*5,raio:20,vol:.8,max:1}); } }
    if(s<15){ heartT-=dt; if(heartT<=0){ heartT=.85; SFX.heart(); } }
    // sendo executado: o mundo fecha em volta, o coração acelera com o progresso e a câmera vira para quem executa
    { const E=m.st==='down'?execRecente(m.id):null; VEU_EXE=lerp(VEU_EXE,E?.3+E.k*.7:0,Math.min(1,dt*6)); $('#exeVeu').style.opacity=VEU_EXE.toFixed(2);
      if(E){ heartT-=dt; if(heartT<=0){ heartT=.95-.62*E.k; SFX.heart(); }
        if(ESP.exeVirou!==E.por){ const p=V.actors.find(a=>a.id===E.por); if(p&&!p.hidden){ ESP.virar={yaw:Math.atan2(-(p.x-m.x),-(p.z-m.z)),t:.6}; ESP.exeVirou=E.por; } } }
      else if(m.st!=='down') ESP.exeVirou=null; }
    bellT-=dt; if(bellT<=0){ bellT=rand(45,80); SFX.bell(); }
    gotaT-=dt; if(gotaT<=0){ gotaT=rand(2.5,8); if(Sim.coberto(pos.x,pos.z)){ const a=rand(0,6.283), r=rand(2,7); SFX.gota(pos.x+Math.cos(a)*r,pos.z+Math.sin(a)*r); } } // pingos de água na nave
    updateHUD(dt,m); atualizarPings(dt); atualizarCaderno(); atualizarFalasBots(); atualizarTutorial(dt,m); atualizarDicas(dt,m); atualizarTensao(dt,m); if(FL.aberto){ FL.t-=dt; if(FL.t<=0||m.st==='dead'){ FL.aberto=false; desenharFalas(); } } atualizarMarcas(m); atualizarLegendas(dt); atualizarBussola(m);
  } else {
    $('#vignette').style.opacity=0; renderer.domElement.style.filter='';
    if(vmH){ vmH.visible=false; vmC.visible=false; ARMA.S.visivel=false; ARMA.S.recarga=null; } // fora da partida, nada de arma na mão
    const a=now*.00004; camera.position.set(6+Math.sin(a)*17,3.4,-4+Math.cos(a)*13); camera.lookAt(6,4.5,-4); camera.rotateY(-.28);
    if(V&&V.altars) syncAltars(dt);
  }
  if(GRADE){ GRADE.uniforms.uTempo.value=(now*.001)%100; const mS=V&&V.phase==='play'?me():null; const san=mS?mS.sanity:100; GRADE.uniforms.uAberr.value=.0012+Math.max(0,(45-san)/45)*.006; }
  if(GRADE&&composer){ GRADE.uniforms.tDepth.value=composer.readBuffer.depthTexture; GRADE.uniforms.uTexel.value.set(1/innerWidth,1/innerHeight);
    camera.updateMatrixWorld(); GRADE.uniforms.uCamMundo.value.copy(camera.matrixWorld); const tv=Math.tan(camera.fov*Math.PI/360); GRADE.uniforms.uTan.value.set(tv*camera.aspect,tv); GRADE.uniforms.uT.value=now*.001; }
  seguirLua(); // depois de a câmera andar neste quadro: céu, lua e sombra ficam centrados nela
  const tRq=performance.now();
  // vitrine de animações: pode olhar a arma de lado, de cima ou de frente (ARMA.vista); o jogo não muda
  const camR=(ARMA&&ARMA.camVista(camera))||camera; if(composer&&composer.passes[0]) composer.passes[0].camera=camR;
  renderer.info.reset(); if(composer&&USAR_POS) composer.render(); else renderer.render(scene,camR); INFO_QUADRO={chamadas:renderer.info.render.calls,triangulos:renderer.info.render.triangles};
  const t1q=performance.now(); cpuMs=cpuMs*.9+(t1q-t0q)*.1; if(AUTOTEST) amostraQuadro(tRq-t0q,t1q-tRq);
}
function show(id,on){ document.getElementById(id).classList.toggle('on',on); }

function boot(){
  buildTextures(); buildTexturasExtras(); buildWorld(); if(!ASILO){ buildFloresta(); buildCatedralViva(); } const fusao=fundirEstaticos(); if(!ASILO) buildMarcas(); if(AUTOTEST){ window.__fusao=fusao; window.__VEG=VEG; } buildAltars(); buildViewmodels(); buildParticles(); buildStrip(); preaquecerEfeitos();
  if(PERF.leve){ const vistos=new Set(); scene.traverse(o=>{ const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[]; for(const m of ms){ if(vistos.has(m)) continue; vistos.add(m);
      if(m.normalMap){ m.normalMap=null; m.needsUpdate=true; } } }); } // relevo por normal map pesa em GPU fraca e quase não aparece na névoa
  applySet(); $('#loading').style.display='none';
  requestAnimationFrame(tick);
  if(!APP||SET.servidor) sondarServidor(APP?0:2);
  // a página recarregou no mapa de uma sala: entra nela de novo
  { let S=null; try{ S=JSON.parse(sessionStorage.getItem('rr-entrar-sala')||'null'); sessionStorage.removeItem('rr-entrar-sala'); }catch(e){} if(S&&S.code) setTimeout(()=>connect(false,S.code,S.name),300); }
  // botão voltar do Android: pausa a partida em vez de fechar o app
  if(APP){ try{ const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App; if(A) A.addListener('backButton',()=>{ if(V&&V.phase==='play'&&locked) unlock(); else if(settingsOpen){ settingsOpen=false; screenKey=''; } }); }catch(e){} }
  if(AUTOTEST){ window.__T={perfil:()=>{ let luzes=0; scene.traverseVisible(o=>{ if(o.isPointLight||o.isSpotLight) luzes++; }); return {fps:Math.round(fpsEMA),qual:SET.qual,toque:TQ.ativo,luzes,res:RES.aplicada,pos:USAR_POS,sombras:renderer.shadowMap.enabled}; },grade:()=>GRADE,Sim,get AV(){ return AV; },AMOS,VM,FX,get actorMeshes(){ return actorMeshes; },tocar,ARMA,get cpuMs(){ return cpuMs; },quadros:estatQuadros,zerarQuadros:()=>{ QUADROS.log.length=0; QUADROS.ren.length=0; },get efeitos(){ return EFEITOS.length; },get tracers(){ return tracers.length; },textoRelatorio:()=>textoRelatorio(dadosRelatorio()),get game(){return game;},get V(){return V;},startLocal,sendAct,cena:()=>scene,get SKINS(){ return SKINS; },get REAGM(){ return reagentMeshes; },TEX,RT,PERFIL_ARMA,fxExecucoes:()=>FX_EXE_N,rend:()=>renderer,malhas:()=>actorMeshes,info:()=>({geometrias:renderer.info.memory.geometries,texturas:renderer.info.memory.textures,chamadas:INFO_QUADRO.chamadas,triangulos:INFO_QUADRO.triangulos,objetos:(()=>{let n=0;scene.traverse(()=>n++);return n;})()}),derrubar:()=>{ if(ws) ws.close(); },get recon(){return RECON.ativo;},get down(){return down;},setBind,SET,C,LOOK,ESP,CL,climaDe,LT,amostrarNoite,perfilJogador:perfil,PF,fazerPing,PINGS,TN,travar:()=>lock(),MUS,AU,connect,NET,setMouse:v=>mouseL=v,get meCid(){return meCid;},get VIS_ASILO(){ return VIS_ASILO; },NOITE,MAPA:MAPA_BOOT,mapSvg,FONTES,DC}; }
}
{ const L=$('#loading'), d=Object.values(DICAS); L.innerHTML=`<div style="text-align:center">${ASILO?'Abrindo o asilo…':'Esculpindo a catedral…'}<p style="font-family:var(--sans,sans-serif);font-size:15px;max-width:440px;margin:18px auto 0;color:#8f877b">Dica: ${esc(d[Math.floor(Math.random()*d.length)])}</p></div>`; }
setTimeout(()=>{ try{ boot(); }catch(e){ $('#loading').textContent='Não foi possível iniciar o WebGL neste navegador.'; console.error(e); } },30);
// ================= ARSENAL =================
// As armas de perto, as skins da coleção e a inspeção de cada uma. Abre do menu: uma partida local parada no meio da nave,
// sem ninguém por perto e sem HUD. A arma é a mesma da primeira pessoa no jogo (mesmo modelo, mesma animação, mesma
// luz de leitura); "Estúdio" só fortalece essa luz. A escolha fica salva e vai junto quando você entra numa sala.
const ARS={ativo:false,arma:'carabina',vista:null,estudio:true,el:null};
// lastPhase zerado: depois de uma partida ele ficou em 'play', e a do Arsenal chega lá sem quadro no meio (o painel não abria)
function startArsenal(){ audioInit(); ARS.ativo=true; document.body.classList.add('arsenal'); lastPhase=''; startLocal({papel:'H'}); }
function sairArsenal(){ ARS.ativo=false; document.body.classList.remove('arsenal'); camera.clearViewOffset(); if(ARS.el){ ARS.el.remove(); ARS.el=null; } if(ARMA) ARMA.forcar(null); sairParaMenu(); }
function arsenalComeca(){ show('hud',false); unlock(); arsenalForca('sacar'); arsenalPainel(); }
// o jogador fica parado no corredor da nave, olhando as velas; os outros longe
function arsenalEnquadra(){ const W=innerWidth, H=innerHeight; if(W<700){ camera.clearViewOffset(); return; } const f=1.6; camera.setViewOffset(W*f,H*f,W*(f-1),H*(f-1)*.75,W,H); }
function arsenalPosa(){ const m=me(); if(!m) return; arsenalEnquadra(); m.x=2; m.z=-46; m.invuln=999; LOOK.yaw=.35; LOOK.pitch=-.06; m.yaw=LOOK.yaw; m.pitch=LOOK.pitch;
  for(const a of game.actors) if(a!==m){ a.x=a.team==='H'?-125:125; a.z=a.team==='H'?-8:8; } }
function arsenalForca(clipe,extra){ if(!ARMA) return; ARMA.forcar(Object.assign({arma:ARS.arma,clipe,vista:ARS.vista,estudio:ARS.estudio,repetir:false,t:null,fervor:100,vel:1},extra||{})); }
function arsenalPainel(){ if(!SKINS) return; let el=ARS.el; if(!el){ el=ARS.el=document.createElement('div'); el.id='arsenal'; document.body.appendChild(el);
    ['mousedown','pointerdown','keydown','wheel'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation())); }
  const L=SKINS.SKINS[ARS.arma], usada=SKINS.ESC[ARS.arma], nomes={carabina:'Carabina',revolver:'Revólver',cetro:'Cetro'}, cetro=ARS.arma==='cetro';
  el.innerHTML=`<h2>Arsenal</h2><div class="col">${esc(SKINS.COLECAO.nome)}</div><p class="txt">${esc(SKINS.COLECAO.texto)} Nada muda no jogo além da aparência; tudo é livre para escolher.</p>
    <div class="abas">${['carabina','revolver','cetro'].map(k=>`<button data-arma="${k}" class="${k===ARS.arma?'sel':''}">${nomes[k]}</button>`).join('')}</div>
    ${L.map(s=>{ const O=SKINS.OFICIOS[s.oficio]; return `<div class="skin ${s.id===usada?'sel':''}" data-skin="${s.id}"><span class="of" style="color:${O.cor}">${O.nome}</span><b>${esc(s.nome)}</b>${s.id===usada?' <small style="color:var(--gold)">· em uso</small>':''}<p>${esc(s.texto)}</p></div>`; }).join('')}
    <div class="acoes"><button data-acao="inspecao">Inspecionar</button>${cetro?'<button data-acao="tiro">Lançar sigilo</button>':'<button data-acao="recarga">Recarregar</button>'}<button data-acao="sacar">Sacar</button></div>
    <div class="rot">Vista</div><div class="abas">${[['','Jogador'],['ladoPerto','De lado'],['perto','De perto']].map(([v,t])=>`<button data-vista="${v}" class="${(ARS.vista||'')===v?'sel':''}">${t}</button>`).join('')}</div>
    <div class="rot">Luz</div><div class="abas">${[['0','Da noite'],['1','Estúdio']].map(([v,t])=>`<button data-luz="${v}" class="${(ARS.estudio?'1':'0')===v?'sel':''}">${t}</button>`).join('')}</div>
    <button class="go ghost sair" id="bArsSair">Voltar ao menu</button>`;
  el.querySelectorAll('[data-arma]').forEach(b=>b.onclick=()=>{ ARS.arma=b.dataset.arma; arsenalForca('sacar'); arsenalPainel(); SFX.click(); });
  el.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{ ARMA.trocarSkin(ARS.arma,b.dataset.skin); arsenalForca('inspecao'); arsenalPainel(); SFX.click(); });
  el.querySelectorAll('[data-acao]').forEach(b=>b.onclick=()=>{ const a=b.dataset.acao; if(a==='recarga') arsenalForca('recarga',{vazia:true,n:3,carga:0}); else if(a==='tiro'){ arsenalForca('pronta'); setTimeout(()=>ARMA.tiroVitrine&&ARMA.tiroVitrine(),60); } else arsenalForca(a); });
  el.querySelectorAll('[data-vista]').forEach(b=>b.onclick=()=>{ ARS.vista=b.dataset.vista||null; if(ARMA.S.forca){ ARMA.S.forca.vista=ARS.vista; ARMA.S.vista=ARS.vista; } arsenalPainel(); });
  el.querySelectorAll('[data-luz]').forEach(b=>b.onclick=()=>{ ARS.estudio=b.dataset.luz==='1'; if(ARMA.S.forca) ARMA.S.forca.estudio=ARS.estudio; arsenalPainel(); });
  el.querySelector('#bArsSair').onclick=sairArsenal; }
// #vitrine: abre direto numa partida local com a vitrine das animações
if(location.hash.startsWith('#vitrine')){ const iv=setInterval(()=>{ try{ if(!ARMA) return; if(!game) startLocal(); else if(game.phase==='intro') sendAct({type:'ready'});
  if(V&&V.phase==='play'){ clearInterval(iv); ARMA.painel(true); } }catch(e){ console.error(e); clearInterval(iv); } },500); }
})();
