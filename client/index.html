<style>
:root{

  --steel:#6d7e8e; --bronze:#8c6239; --iron:#15181c; --iron-2:#22272d;
  --bone:#e8e0d0; --muted:#a39b8e; --bg:#050506;
  --serif:'IM Fell English', Georgia, 'Times New Roman', serif;
  --cond:'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#050506; --bone:#e8e0d0; } }
:root[data-theme="dark"]{ --bg:#050506; --bone:#e8e0d0; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ height:100%; margin:0; background:var(--bg); color:var(--bone); overflow:hidden; font-family:var(--cond); -webkit-font-smoothing:antialiased; }
#view{ position:fixed; inset:0; } #view canvas{ display:block; width:100%; height:100%; transition:filter .4s linear; }
#hud{ position:fixed; inset:0; pointer-events:none; display:none; } #hud.on{ display:block; }
.plate{ background:linear-gradient(180deg, rgba(38,43,50,.84), rgba(18,21,25,.88)); border:1px solid rgba(140,98,57,.45);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px); }
#top{ position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:18px; padding:8px 22px; }
#top .side{ font-size:15px; color:var(--muted); min-width:130px; } #top .side b{ font-size:26px; color:var(--bone); font-weight:600; margin:0 6px; }
#top .a{ text-align:right; }
#clock{ font-size:34px; font-weight:600; min-width:88px; text-align:center; line-height:1.05; }
#roundName{ font-family:var(--serif); font-size:15px; color:var(--gold); text-align:center; }
#clockWrap{ display:flex; flex-direction:column; align-items:center; }
#strip{ position:absolute; top:86px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
.pip{ width:64px; text-align:center; font-size:12px; color:var(--muted); }
.pip .gem{ width:26px; height:26px; margin:0 auto 3px; transform:rotate(45deg); border:1.5px solid #555c65; background:rgba(10,12,14,.7); display:grid; place-items:center; }
.pip .gem i{ transform:rotate(-45deg); font-style:normal; font-size:13px; font-weight:700; color:#7d858f; }
.pip.chosen .gem{ outline:1.5px solid var(--crimson-hi); outline-offset:3px; }
.pip.awake .gem{ border-color:#9b6fc0; background:rgba(107,58,138,.35); } .pip.awake .gem i{ color:#d6b8f0; }
.pip.confirmed .gem{ border-color:#c69cf0; background:rgba(107,58,138,.6); box-shadow:0 0 10px rgba(180,120,240,.6); } .pip.confirmed .gem i{ color:#fff; }
.pip.decoy .gem{ border-color:#6c6c6c; background:rgba(60,60,60,.4); } .pip.decoy .gem i{ color:#aaa; text-decoration:line-through; }
.pip.clean .gem i{ color:#4f5760; }
.pip.active .gem{ border-color:var(--crimson-hi); background:rgba(163,32,58,.55); box-shadow:0 0 14px rgba(224,67,94,.8); animation:throb 1s ease-in-out infinite; } .pip.active .gem i{ color:#fff; }
.pip.fenda .gem{ border-color:#3a1b4a; background:#12071a; } .pip.fenda .gem i{ color:var(--crimson-hi); }
.pip.farol .gem{ border-color:var(--gold-hi); background:rgba(210,173,98,.45); } .pip.farol .gem i{ color:#fff; }

#feed{ position:absolute; top:16px; left:18px; width:350px; display:flex; flex-direction:column; gap:4px; }

#feed div.c{ border-left-color:var(--crimson-hi); } #feed div.h{ border-left-color:var(--gold); } #feed div.big{ font-family:var(--serif); font-size:20px; }

#cross{ position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; }
#cross::before,#cross::after{ content:''; position:absolute; background:rgba(232,224,208,.85); }
#cross::before{ left:10px; top:3px; width:2px; height:16px; } #cross::after{ top:10px; left:3px; height:2px; width:16px; }
#cross i{ position:absolute; left:8px; top:8px; width:6px; height:6px; background:var(--bg); }
#marks{ position:absolute; inset:0; overflow:hidden; }
.mk{ position:absolute; transform:translate(-50%,-100%); text-align:center; font-size:14px; line-height:1.15; white-space:nowrap; color:var(--bone); text-shadow:0 1px 2px #000,0 0 6px #000; }
.mk b{ display:block; width:9px; height:9px; margin:3px auto 0; transform:rotate(45deg); background:var(--gold); }
.mk.cult b{ background:var(--crimson-hi); }
.mk.caido{ color:var(--crimson-hi); font-weight:600; } .mk.caido b{ background:var(--crimson-hi); animation:throb 1s ease-in-out infinite; }
.mk.npc{ color:#e8d6a8; } .mk.npc b{ background:none; border:2px solid var(--gold); border-radius:50%; }
.mk.obj{ color:#ff8fa3; } .mk.obj b{ width:12px; height:12px; background:none; border:2px solid var(--crimson-hi); }
.mk small{ display:block; color:var(--muted); font-size:12px; }
#dmgDir{ position:absolute; left:50%; top:50%; width:0; height:0; }
#dmgDir i{ position:absolute; left:-120px; top:-120px; width:240px; height:240px; border-radius:50%; border:5px solid transparent; border-top-color:rgba(230,40,60,.95);
  -webkit-mask:radial-gradient(circle, transparent 60%, #000 61%); filter:drop-shadow(0 0 6px rgba(230,40,60,.9)); transition:opacity 1.1s linear; }
#habNota{ position:absolute; left:50%; top:calc(50% + 62px); transform:translateX(-50%); font-family:var(--serif); font-size:21px; background:rgba(8,9,11,.8); padding:4px 14px; border-left:2px solid currentColor; text-shadow:0 1px 2px #000; opacity:0; transition:opacity .5s; white-space:nowrap; }

.tool.pulso{ animation:pulso .6s ease-out; } @keyframes pulso{ 0%{ box-shadow:0 0 0 0 rgba(243,213,142,.9); border-color:var(--gold-hi); } 100%{ box-shadow:0 0 0 14px rgba(243,213,142,0); } }

#ammoHint{ position:absolute; left:50%; top:calc(50% + 30px); transform:translateX(-50%); font-size:15px; color:var(--gold-hi); text-shadow:0 1px 2px #000; }
#hitmark.head{ border-color:var(--gold-hi); } #hitmark.kill{ border-color:var(--crimson-hi); border-width:3px; }
#hitmark{ position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; opacity:0; border:2px solid #fff; transform:rotate(45deg) scale(.6); }
#interact{ position:absolute; left:50%; top:calc(50% + 46px); transform:translateX(-50%); text-align:center; display:none; }
#interact svg{ width:46px; height:46px; display:block; margin:0 auto 4px; }
#interact .lbl{ font-size:18px; background:rgba(8,9,11,.72); padding:3px 10px; margin-top:3px; }

#race .t{ font-family:var(--serif); font-size:17px; text-align:center; margin-bottom:6px; }
#race .row{ display:grid; grid-template-columns:78px 1fr 44px; align-items:center; gap:8px; font-size:14px; margin-top:4px; }
#race .track{ height:10px; background:#101316; position:relative; border:1px solid #333a42; } #race .track span{ position:absolute; left:0; top:0; bottom:0; }

#vitals{ position:absolute; left:18px; bottom:18px; width:300px; padding:12px 16px; }
.meter{ margin-top:6px; } .meter .lab{ display:flex; justify-content:space-between; font-size:14px; color:var(--muted); } .meter .lab b{ color:var(--bone); font-size:18px; font-weight:600; }
.meter .trk{ height:8px; background:#0d0f12; border:1px solid #333a42; margin-top:2px; position:relative; } .meter .trk span{ display:block; height:100%; }
#hpFill{ background:linear-gradient(90deg,#5d6b77,#c9d3dc); } #shFill{ position:absolute; top:0; right:0; height:100%; background:rgba(200,120,255,.7); }

.tools{ display:flex; gap:6px; margin-top:8px; justify-content:flex-end; flex-wrap:wrap; }

#death div{ text-align:center; } #death h2{ font-family:var(--serif); font-weight:400; font-size:44px; margin:0; } #death p{ font-size:20px; color:var(--muted); margin:6px 0; }

#vignette,#hurt,#blind{ position:fixed; inset:0; pointer-events:none; opacity:0; }

.screen{ position:fixed; inset:0; display:none; place-items:center; background:radial-gradient(ellipse at 50% 38%, rgba(40,14,24,.55), rgba(3,3,4,.94) 70%); overflow:auto; }
.screen.on{ display:grid; }
.panel{ width:min(800px, calc(100% - 32px)); padding:26px 40px 24px; margin:16px 0; }
.panel h1{ font-family:var(--serif); font-weight:400; font-size:clamp(42px,6vw,68px); line-height:1; margin:6px 0 4px; text-align:center; }
.panel h2{ font-family:var(--serif); font-weight:400; font-size:32px; margin:0 0 8px; }
.panel h3{ font-family:var(--serif); font-weight:400; font-size:21px; margin:14px 0 6px; }

.cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }

.btnrow{ display:flex; gap:12px; justify-content:center; margin-top:18px; flex-wrap:wrap; align-items:center; }

  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%); }
button.go.gold{ background:linear-gradient(180deg,#b88d3e,#6d4f1c); border-color:var(--gold-hi); }

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const {FEITICOS,FEIT_BY_TEAM,NPCS,ITENS,CFG,CLASSES,CLASS_BY_TEAM,HALF,CATEDRAL,SPAWN,CANDLES,WALLDEF,PILLARS,PEWS,BOX,TALL,segBox,clamp,lerp}=Sim;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const AUTOTEST=location.hash.startsWith('#autotest');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= ESTILO ILUSTRADO =================
// A luz passa a mudar em faixas, como numa ilustração; o brilho especular vira um reflexo recortado.
// Materiais com RIMLUZ ganham luz de recorte nas silhuetas (personagens).
(function estiloIlustrado(){
  const alvo='vec3 outgoingLight = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + reflectedLight.directSpecular + reflectedLight.indirectSpecular + totalEmissiveRadiance;';
  const novo=`vec3 albedoT = max( diffuseColor.rgb, vec3( 0.04 ) );
	vec3 luzT = ( reflectedLight.directDiffuse + reflectedLight.indirectDiffuse ) / albedoT;
	float liT = dot( luzT, vec3( 0.299, 0.587, 0.114 ) );
	float bT = 0.035;
	bT = mix( bT, 0.11, smoothstep( 0.03, 0.05, liT ) );
	bT = mix( bT, 0.26, smoothstep( 0.11, 0.15, liT ) );
	bT = mix( bT, 0.52, smoothstep( 0.30, 0.38, liT ) );
	bT = mix( bT, 0.95, smoothstep( 0.70, 0.85, liT ) );
	vec3 difT = luzT * ( bT / max( liT, 0.0001 ) ) * albedoT;
	vec3 espT = reflectedLight.directSpecular + reflectedLight.indirectSpecular;
	espT *= smoothstep( 0.06, 0.09, dot( espT, vec3( 0.333 ) ) ) * 1.15;
	vec3 outgoingLight = difT + espT + totalEmissiveRadiance;
	#ifdef RIMLUZ
		float rimT = pow( 1.0 - clamp( dot( normal, geometry.viewDir ), 0.0, 1.0 ), 2.5 );
		outgoingLight += RIMLUZ * smoothstep( 0.32, 0.5, rimT ) * 0.85;
	#endif`;
  for(const k of ['standard','physical']){ const sh=THREE.ShaderLib[k]; if(sh&&sh.fragmentShader.includes(alvo)) sh.fragmentShader=sh.fragmentShader.replace(alvo,novo); }
})();
// ================= RENDERER =================
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.info.autoReset=false; let INFO_QUADRO={chamadas:0,triangulos:0};
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25; renderer.outputEncoding=THREE.sRGBEncoding;
$('#view').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05070c); scene.fog=new THREE.FogExp2(0x0b0d14,0.026);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,220); camera.rotation.order='YXZ'; scene.add(camera);
let composer=null, GRADE=null;
try{ composer=new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene,camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.55,0.72)); composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  // Etapa final: sombras puxadas para o azul-frio, luzes para o âmbar das velas, vinheta oval,
  // granulado de filme e aberração cromática nas bordas, que cresce quando a sanidade cai.
  for(const rt of [composer.renderTarget1,composer.renderTarget2]){ rt.depthTexture=new THREE.DepthTexture(); rt.depthTexture.type=THREE.UnsignedIntType; rt.depthBuffer=true; }
  GRADE=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},tDepth:{value:null},uTexel:{value:new THREE.Vector2(1/innerWidth,1/innerHeight)},uNear:{value:.05},uFar:{value:220},uTinta:{value:new THREE.Color(0x0c0610)},uTempo:{value:0},uAberr:{value:.0015},uVinheta:{value:.42},uGrao:{value:.045}},
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:`uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform vec2 uTexel; uniform float uNear,uFar; uniform vec3 uTinta; uniform float uTempo,uAberr,uVinheta,uGrao; varying vec2 vUv;
      float lin(float d){ float z=d*2.0-1.0; return (2.0*uNear*uFar)/(uFar+uNear-z*(uFar-uNear)); }
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){ vec2 c=vUv-.5; float r=length(c*vec2(1.25,1.0));
        vec2 d=c*uAberr*(1.0+r*6.0);
        vec3 col=vec3(texture2D(tDiffuse,vUv+d).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-d).b);
        float lum=dot(col,vec3(.2126,.7152,.0722));
        vec2 px=uTexel*1.4; float d0=lin(texture2D(tDepth,vUv).x);
        float dl=lin(texture2D(tDepth,vUv-vec2(px.x,0.)).x), dr=lin(texture2D(tDepth,vUv+vec2(px.x,0.)).x), du=lin(texture2D(tDepth,vUv+vec2(0.,px.y)).x), dd=lin(texture2D(tDepth,vUv-vec2(0.,px.y)).x);
        float salto=max(max(abs(dl-d0),abs(dr-d0)),max(abs(du-d0),abs(dd-d0)))/max(d0,.05);
        float i0=1.0/d0, dobra=abs(1.0/dl+1.0/dr+1.0/du+1.0/dd-4.0*i0)/i0;
        float borda=max(smoothstep(.1,.2,salto),smoothstep(.012,.03,dobra))*(1.0-smoothstep(28.0,60.0,d0));
        if(d0>uFar*.95) borda=smoothstep(.1,.2,salto);
        vec3 sombra=vec3(.9,.85,1.08), luz=vec3(1.1,.98,.86);
        col*=mix(sombra,luz,smoothstep(.08,.65,lum));
        col=mix(vec3(lum),col,1.22);
        col=(col-.5)*1.1+.5+.01;
        col=mix(col,uTinta,borda*.88);
        col*=1.0-smoothstep(.25,.95,r)*uVinheta;
        col+=(h(vUv*vec2(1731.0,977.0)+uTempo)-.5)*uGrao;
        gl_FragColor=vec4(clamp(col,0.0,1.0),1.0); }`});
  composer.addPass(GRADE); }catch(e){ composer=null; }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

// ================= TEXTURES =================
function makeNoise(seed){ let s=seed; const r=()=>(s=(s*16807)%2147483647)/2147483647; const g=new Float32Array(65536); for(let i=0;i<65536;i++) g[i]=r();
  const h=(a,b,P)=>g[(((a%P)+P)%P)*256+(((b%P)+P)%P)];
  function vn(x,y,P){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),w=yf*yf*(3-2*yf); return lerp(lerp(h(xi,yi,P),h(xi+1,yi,P),u),lerp(h(xi,yi+1,P),h(xi+1,yi+1,P),u),w); }
  function fbm(x,y,P,oct){ let a=0,amp=.5,f=1,n=0; for(let o=0;o<oct;o++){ a+=amp*vn(x*f,y*f,Math.min(256,P*f)); n+=amp; amp*=.5; f*=2; } return a/n; }
  return {vn,fbm,r}; }
function pbr(size,fn,normalK){
  const H=new Float32Array(size*size), C=new Uint8ClampedArray(size*size*4), R=new Uint8ClampedArray(size*size*4), o={h:0,r:0,g:0,b:0,ro:0};
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){ fn(x/size,y/size,o); const i=y*size+x; H[i]=o.h; C[i*4]=o.r; C[i*4+1]=o.g; C[i*4+2]=o.b; C[i*4+3]=255; R[i*4]=R[i*4+1]=R[i*4+2]=o.ro*255; R[i*4+3]=255; }
  const N=new Uint8ClampedArray(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){ const xl=(x-1+size)%size,xr=(x+1)%size,yu=(y-1+size)%size,yd=(y+1)%size;
    const dx=(H[y*size+xr]-H[y*size+xl])*normalK, dy=(H[yd*size+x]-H[yu*size+x])*normalK, l=Math.hypot(dx,dy,1), i=(y*size+x)*4;
    N[i]=(-dx/l*.5+.5)*255; N[i+1]=(dy/l*.5+.5)*255; N[i+2]=(1/l*.5+.5)*255; N[i+3]=255; }
  const tex=(arr,srgb)=>{ const c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d').putImageData(new ImageData(arr,size,size),0,0);
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy()); if(srgb) t.encoding=THREE.sRGBEncoding; return t; };
  return {map:tex(C,true),normalMap:tex(N,false),roughnessMap:tex(R,false)};
}
const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const TEX={};
function buildTextures(){
  const n=makeNoise(1337), tone=[]; for(let i=0;i<64;i++) tone.push(0.78+n.r()*0.3);
  TEX.floor=pbr(512,(u,v,o)=>{ const T=4,tx=Math.floor(u*T),ty=Math.floor(v*T),lu=u*T-tx,lv=v*T-ty,e=Math.min(lu,1-lu,lv,1-lv);
    const f=n.fbm(u*8,v*8,8,5),f2=n.fbm(u*3+7,v*3+3,3,4),crack=Math.abs(n.fbm(u*16+2,v*16,16,3)-.5)<.006?.6:0,gr=smooth(.015,.05,e),k=tone[(tx*7+ty*3)%64]*(.72+.5*f)*(.75+.45*f2);
    o.h=gr*(.55+.35*f)-crack*.25; o.r=78*k*(.35+.65*gr)*(1-crack*.5); o.g=72*k*(.35+.65*gr)*(1-crack*.5); o.b=66*k*(.38+.62*gr)*(1-crack*.5); o.ro=lerp(.95,.55+.3*f,gr); },2.2);
  TEX.wall=pbr(512,(u,v,o)=>{ const rows=6,ry=Math.floor(v*rows),lv=v*rows-ry,off=(ry%2)*.5,cols=3,cx=Math.floor(u*cols+off),lu=u*cols+off-cx,e=Math.min(lu,1-lu,lv*.5,(1-lv)*.5);
    const f=n.fbm(u*10,v*10,10,5),moss=smooth(.55,.75,n.fbm(u*4+9,v*4,4,4))*smooth(.3,1,v),bev=smooth(0,.05,e),t=.8+.35*tone[(cx*5+ry*11)%64]-.2,k=(.45+.55*bev)*t*(.75+.45*f);
    o.h=bev*.7+f*.3; o.r=lerp(86,48,moss*.6)*k; o.g=lerp(80,56,moss*.6)*k; o.b=lerp(74,44,moss*.6)*k; o.ro=.85+.1*f; },2.6);
  TEX.wood=pbr(256,(u,v,o)=>{ const w=n.fbm(u*2,v*6,2,4),g=.5+.5*Math.sin((u*28+w*7)*Math.PI),f=n.fbm(u*20,v*4,16,3),k=.6+.4*g; o.h=g*.4+f*.3; o.r=70*k+20*f; o.g=42*k+10*f; o.b=26*k+6*f; o.ro=.6+.25*f; },1.5);
  TEX.marble=pbr(256,(u,v,o)=>{ const f=n.fbm(u*4,v*4,4,5),vein=Math.pow(1-Math.abs(Math.sin((u*3+v*2+f*4)*Math.PI)),10),k=.78+.2*f-vein*.55; o.h=f*.2-vein*.2; o.r=200*k; o.g=194*k; o.b=186*k; o.ro=.28+.2*f+vein*.3; },1.2);
  TEX.metal=pbr(256,(u,v,o)=>{ const f=n.fbm(u*8,v*8,8,5),scr=Math.abs(Math.sin(u*60+n.fbm(u*3,v*3,3,2)*20))>.985?1:0,pat=smooth(.55,.7,n.fbm(u*5+3,v*5,5,4)),k=.8+.3*f+scr*.3;
    o.h=f*.3+scr*.15; o.r=lerp(120,58,pat)*k; o.g=lerp(84,78,pat)*k; o.b=lerp(48,60,pat)*k; o.ro=.35+.3*f+pat*.3; },1.2);
}
function buildTexturasExtras(){
  const n=makeNoise(4242);
  TEX.cloth=pbr(256,(u,v,o)=>{ const w=Math.sin(u*180*Math.PI)*Math.sin(v*180*Math.PI), f=n.fbm(u*6,v*6,6,4), gasto=smooth(.55,.85,n.fbm(u*3+5,v*3,3,4)), k=.8+.1*w+.3*(f-.5)-gasto*.2;
    o.h=.5+.3*w+f*.25; o.r=o.g=o.b=clamp(240*k,0,255); o.ro=.95; },1.6);
  TEX.leather=pbr(256,(u,v,o)=>{ const f=n.fbm(u*14,v*14,14,4), vinco=Math.pow(Math.abs(n.fbm(u*4+2,v*4,4,3)-.5)*2,6), k=.82+.25*(f-.5)-vinco*.3;
    o.h=f*.4-vinco*.3; o.r=o.g=o.b=clamp(235*k,0,255); o.ro=.55+.3*f; },1.8);
  ['cloth','leather'].forEach(k=>['map','normalMap','roughnessMap'].forEach(m=>TEX[k][m].repeat.set(2,2)));
}
const matPano=(cor,r)=>new THREE.MeshStandardMaterial({color:cor,map:TEX.cloth.map,normalMap:TEX.cloth.normalMap,roughness:r||.95,emissive:0x000000});
const matCouro=cor=>new THREE.MeshStandardMaterial({color:cor,map:TEX.leather.map,normalMap:TEX.leather.normalMap,roughness:.68,emissive:0x000000});
const matMetal=(cor,r,m)=>new THREE.MeshStandardMaterial({color:cor,roughness:r==null?.35:r,metalness:m==null?.9:m,normalMap:TEX.metal.normalMap,emissive:0x000000});
const V2=(x,y)=>new THREE.Vector2(x,y), V3=(x,y,z)=>new THREE.Vector3(x,y,z);
// Perfil torneado: a silhueta girada em volta do eixo vertical (túnicas, capuzes, chapéus, casacos).
function torno(pts,mat,segs){ return new THREE.Mesh(new THREE.LatheGeometry(pts.map(q=>V2(q[0],q[1])),segs||28),mat); }
// Barra esfarrapada: desloca os vértices de baixo com ondas irregulares.
function esfarrapar(mesh,amp,seed){ const geo=mesh.geometry, p=geo.attributes.position; let mn=1e9; for(let i=0;i<p.count;i++) mn=Math.min(mn,p.getY(i));

// Chão da mata com trilhas e clareiras pintadas por vértice; árvores e arbustos desenhados por instância
// (uma chamada de desenho por tipo de peça, centenas de árvores cada). A colisão vem da simulação.
function buildFloresta(){
  const n=makeNoise(9091);
  TEX.chao=pbr(512,(u,v,o)=>{ const f=n.fbm(u*8,v*8,8,5), fol=smooth(.52,.66,n.fbm(u*16+9,v*16+2,16,3)), musgo=smooth(.5,.72,n.fbm(u*4+5,v*4+1,4,4)), gr=n.fbm(u*32,v*32,32,2);
    const k=.62+.5*f; o.h=f*.45+fol*.35+gr*.2; o.r=lerp(lerp(58,40,musgo),84,fol*.7)*k; o.g=lerp(lerp(46,54,musgo),56,fol*.7)*k; o.b=lerp(lerp(36,32,musgo),30,fol*.7)*k; o.ro=.96; },2.4);
  const M=40, LX=HALF.x*2+M*2, LZ=HALF.z*2+M*2, sx=Math.round(LX/2), sz=Math.round(LZ/2);
  const geo=new THREE.PlaneGeometry(LX,LZ,sx,sz); geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position, cor=new Float32Array(pos.count*3);
  const segs=[]; Sim.TRILHAS.forEach(T=>{ for(let i=1;i<T.pts.length;i++) segs.push({ax:T.pts[i-1][0],az:T.pts[i-1][1],bx:T.pts[i][0],bz:T.pts[i][1],w:T.w}); });
  const dSeg=(x,z,q)=>{ const dx=q.bx-q.ax,dz=q.bz-q.az,L=dx*dx+dz*dz; const t=clamp(L?((x-q.ax)*dx+(z-q.az)*dz)/L:0,0,1); return Math.hypot(x-(q.ax+dx*t),z-(q.az+dz*t)); };
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i), z=pos.getZ(i);
    let tr=0; for(const q of segs){ const d=dSeg(x,z,q); tr=Math.max(tr,clamp((q.w/2+.8-d)/1.6,0,1)); }

const RECON={ativo:false,ate:0,tentativas:0,nome:'',timer:null};
function connect(create,code,name){
  const proto=location.protocol==='https:'?'wss:':'ws:'; const sock=new WebSocket(proto+'//'+location.host); ws=sock;
  RECON.nome=name||RECON.nome;

    if(m.t==='error'){ if(RECON.ativo){ pararReconexao(m.msg); } else { $('#err')&&($('#err').textContent=m.msg); } sock.close(); return; }
    if(m.t==='welcome'){ MODE='online'; meCid=m.cid; NET.code=m.code; try{ sessionStorage.setItem('rr-sala',m.code); }catch(e){}
      if(m.voltou||RECON.ativo){ RECON.ativo=false; clearTimeout(RECON.timer); NET.snaps=[]; NET.pred=null; NET.pending=[]; NET.offset=null; screenKey=''; feed('Conexão restabelecida. Você voltou ao seu personagem.','big'); } }
    if(m.t==='lobby'){ NET.lobby=m; NET.host=m.host; if(!m.inGame){ V=null; NET.snaps=[]; NET.pred=null; screenKey=''; } }
    if(m.t==='snap') onSnap(m);
  };

    // Caiu no meio de uma partida: tenta voltar por até 2 minutos, que é quanto o servidor guarda a vaga.

  const ts=NET.sent.get(m.ack); if(ts){ const r=performance.now()-ts; NET.ping=NET.ping?NET.ping*.8+r*.2:r; }
  for(const k of NET.sent.keys()) if(k<=m.ack) NET.sent.delete(k);

    if(!NET.pred||NET.predId!==meS.id){ NET.pred=JSON.parse(JSON.stringify(meS)); NET.pred.inp={mx:0,mz:0,sp:false,yaw:meS.yaw,pitch:0,c:{}}; NET.predId=meS.id; NET.pending=[]; LOOK.yaw=meS.yaw; LOOK.pitch=0; }
    const p=NET.pred, keep={inp:p.inp,yaw:p.yaw,pitch:p.pitch}, antesX=p.x, antesZ=p.z;

}

function altarMapStyle(A,i,role){ if(A.state==='fenda') return {fill:'#12071a',stroke:'#e0435e'}; if(A.state==='farol') return {fill:'#6d4f1c',stroke:'#f3d58e'};

let PLANTA_FIXA=null;
function plantaFixa(X,Z,S){ if(PLANTA_FIXA) return PLANTA_FIXA;
  const CT=CATEDRAL, cl=Sim.CLAUSTRO, f=v=>v.toFixed(1); let h='';
  h+=`<rect x="${X(-HALF.x)}" y="${Z(-HALF.z)}" width="${HALF.x*2*S}" height="${HALF.z*2*S}" fill="#0d130f" stroke="#3a4a36" stroke-width="2"/>`;
  Sim.CLAREIRAS.forEach(c=>h+=`<circle cx="${f(X(c.x))}" cy="${f(Z(c.z))}" r="${f(c.r*S)}" fill="#18211a"/>`);
  Sim.TRILHAS.forEach(T=>h+=`<polyline points="${T.pts.map(([x,z])=>f(X(x))+','+f(Z(z))).join(' ')}" fill="none" stroke="#3b3326" stroke-width="${f(T.w*S)}" stroke-linecap="round" stroke-linejoin="round"/>`);
  Sim.ARVORES.forEach(q=>h+=`<circle cx="${f(X(q.x))}" cy="${f(Z(q.z))}" r="${f(Math.max(.9,(q.tipo===1?2.4:1.8)*S*q.s))}" fill="${q.tipo===2?'#2a2620':'#1c2a1d'}"/>`);
  h+=`<rect x="${X(CT.x1)}" y="${Z(CT.z1)}" width="${(CT.x2-CT.x1)*S}" height="${(CT.z2-CT.z1)*S}" fill="#15181c"/>`;
  h+=`<rect x="${X(cl.x1)}" y="${Z(cl.z1)}" width="${(cl.x2-cl.x1)*S}" height="${(cl.z2-cl.z1)*S}" fill="#191d21"/>`;

  PEWS.forEach(p=>h+=`<rect x="${X(Math.min(p[0],p[1]))}" y="${Z(Math.min(p[2],p[3]))}" width="${Math.abs(p[1]-p[0])*S}" height="${Math.abs(p[3]-p[2])*S}" fill="#2a2119"/>`);
  const COR={sebe:'#3a5a3c',ossos:'#8a7f68',menir:'#77746a',carvalho:'#4a3a2e',tenda:'#5a4c34',madeira:'#6a5040',mausoleu:'#58524a',torre:'#6a645a',limite:'#2b3328'};

  TALL.forEach(b=>{ if(Sim.WALLS.some(q=>q.x1===b.x1&&q.z1===b.z1&&q.x2===b.x2&&q.z2===b.z2)) return; h+=`<rect x="${f(X(b.x1))}" y="${f(Z(b.z1))}" width="${f(Math.max(1.5,(b.x2-b.x1)*S))}" height="${f(Math.max(1.5,(b.z2-b.z1)*S))}" fill="#58524a"/>`; }); // pilares
  NPCS.forEach(n=>h+=`<circle cx="${X(n.x)}" cy="${Z(n.z)}" r="4" fill="#d2ad62"/><text x="${X(n.x)}" y="${Z(n.z)-7}" fill="#d2ad62" font-size="10" text-anchor="middle" font-family="Barlow Condensed, sans-serif">${n.nome.replace(/^(o|a) /,'')}</text>`);
  (Sim.LUGARES||[]).forEach(L=>h+=`<text x="${X(L.x)}" y="${Z(L.z)}" fill="#8a8272" font-size="10" font-style="italic" text-anchor="middle" font-family="IM Fell English, Georgia, serif">${L.name}</text>`);
  h+=`<text x="${X(SPAWN.H.x)}" y="${Z(SPAWN.H.z)+34}" fill="#d2ad62" font-size="12" text-anchor="middle" font-family="Barlow Condensed, sans-serif">Caçadores</text><text x="${X(SPAWN.C.x)}" y="${Z(SPAWN.C.z)+34}" fill="#e0435e" font-size="12" text-anchor="middle" font-family="Barlow Condensed, sans-serif">Cultistas</text>`;
  return PLANTA_FIXA=h; }
function mapSvg(svg,opts){
  const S=Math.min(500/(HALF.x*2),350/(HALF.z*2)),ox=270,oz=190,X=x=>ox+x*S,Z=z=>oz+z*S;

  const data=JSON.stringify({match:game.matchId,slots:game.slots,scores:game.scores,stats:game.stats,events:game.log},null,1), name=`ritual-reversal-${game.matchId}.json`;
  try{ if(window.claude&&window.claude.use){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:name,data}); msg.textContent='Registro salvo.'; return; } } }
  catch(e){ if(e&&e.code==='declined'){ msg.textContent='Download cancelado.'; return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); msg.textContent='Registro salvo.';
}
let comoJogarAberto=false;

function openSettings(){ settingsOpen=true; backTo=screenKey; screenKey=''; }
function settingsScreen(){
  const q=(id,v)=>`<button data-q="${v}" class="${SET.qual===v?'sel':''}">${id}</button>`;
  setScreen('settings'+capturing+JSON.stringify(SET.binds)+SET.qual+(SET.rawMouse!==false),`<h2>Ajustes</h2>
    <div class="set"><label for="sSens">Sensibilidade do mouse</label><input id="sSens" type="range" min="20" max="300" step="5" value="${Math.round(SET.sens*100)}"><b id="vSens">${SET.sens.toFixed(2)}</b></div>
    <div class="set"><label for="sVol">Volume</label><input id="sVol" type="range" min="0" max="100" step="2" value="${Math.round(SET.vol*100)}"><b id="vVol">${Math.round(SET.vol*100)}</b></div>
    <div class="set"><label for="sFov">Campo de visão</label><input id="sFov" type="range" min="60" max="105" step="1" value="${SET.fov}"><b id="vFov">${SET.fov}</b></div>
    <div class="set"><label>Qualidade</label><div class="opts">${q('Alto','alto')}${q('Médio','medio')}${q('Baixo','baixo')}</div><b></b></div>

    <p class="fine">Médio desliga o brilho difuso; Baixo desliga também as sombras. O movimento bruto ignora a aceleração do mouse do Windows: deixe ligado se a câmera dá saltos. Vale ao voltar para o jogo.</p>
    <h3>Controles</h3><div class="binds">${Object.keys(BIND_LABEL).map(a=>`<button class="bindrow ${capturing===a?'cap':''}" data-a="${a}"><span>${BIND_LABEL[a]}</span><kbd>${capturing===a?'aperte…':kb(a)}</kbd></button>`).join('')}</div>
    <p class="fine">Clique numa linha e aperte a tecla ou o botão do mouse. Esc cancela. Se a tecla já estiver em uso, as duas ações trocam de lugar.</p>
    <div class="btnrow"><button class="go ghost" id="sDef">Restaurar padrão</button><button class="go" id="sBack">Voltar</button></div>`,
  ()=>{
    const bind=(id,lab,fn,fmt)=>{ const el=$(id); el.oninput=()=>{ fn(+el.value); $(lab).textContent=fmt(+el.value); applySet(); saveSet(); }; };
    bind('#sSens','#vSens',v=>SET.sens=v/100,v=>(v/100).toFixed(2));

    $('#sVol').onchange=()=>SFX.click();
    bind('#sFov','#vFov',v=>SET.fov=v,v=>v);

    scrBody.querySelectorAll('.bindrow').forEach(b=>b.onclick=()=>{ capturing=b.dataset.a; screenKey=''; });
    $('#sDef').onclick=()=>{ SET.binds=Object.assign({},DEF_BIND); saveSet(); toolsKey=''; screenKey=''; };
    $('#sBack').onclick=()=>{ settingsOpen=false; screenKey=''; };
  });
}
function syncScreens(){
  if(RECON.ativo){ reconexaoScreen(); return; }
  if(settingsOpen){ settingsScreen(); return; }
  if(comoJogarAberto&&!MODE){ comoJogarScreen(); return; }
  if(!MODE){ titleScreen(); return; }
  if(MODE==='online'&&!V){ if(NET.lobby) lobbyScreen(); return; }
  if(!V) return;
  const ph=V.phase;
  if(ph==='play'&&lojaAberta){ lojaScreen(); return; }
  if(ph==='play'){ if(MODE==='local'&&paused){ setScreen('pause','<h2 style="text-align:center">Pausado</h2><p style="text-align:center;margin:0 auto">Clique para voltar ao jogo.</p><div class="btnrow"><button class="go" id="bRes">Continuar</button><button class="go ghost" id="bSet2">Ajustes</button></div>',()=>{ $('#bRes').onclick=()=>lock(); $('#bSet2').onclick=openSettings; }); }
    else if(MODE==='online'&&!locked){ setScreen('olock','<h2 style="text-align:center">Clique para jogar</h2><p style="text-align:center;margin:0 auto">No modo online a partida não pausa: enquanto o mouse estiver solto, seu personagem fica parado.</p><div class="btnrow"><button class="go" id="bRes">Jogar</button><button class="go ghost" id="bSet2">Ajustes</button></div>',()=>{ $('#bRes').onclick=()=>lock(); $('#bSet2').onclick=openSettings; }); }
    else hideScreen(); return; }
  if(ph==='pick') pickScreen(); else if(ph==='intro') introScreen(); else if(ph==='summary') summaryScreen(); else if(ph==='final') finalScreen();
}

// ================= LOCAL MODE =================
function startLocal(){ MODE='local'; meCid='local'; game=Sim.createGame({timers:false}); V=game; screenKey=''; }

// ================= MAIN LOOP =================
let fpsEMA=60;
let last=performance.now(), lastPhase='', bellT=45, hallT=8, heartT=0, stepT=0, wasLocked=false;
function tick(now){
  requestAnimationFrame(tick);
  const raw=Math.max(.001,(now-last)/1000), dt=Math.min(.05,raw); last=now; fpsEMA=fpsEMA*.92+(1/raw)*.08;
  if(MODE==='local'&&game){
    paused=game.phase==='play'&&!locked&&!lojaAberta;
    const m=me(); const inp=readInput(dt); ULT_INP=inp;
    if(m&&game.phase==='play'&&!paused){ Sim.moveHuman(game,m,inp,dt); predictFire(dt,m); Sim.step(game,dt); }
    else if(game.phase!=='play') Sim.step(game,dt);
    V=game; const evs=game.events.splice(0); handleEvents(evs,false);
  } else if(MODE==='online'&&V&&ws&&ws.readyState===1){
    const inp=readInput(dt); ULT_INP=inp; inp.seq=++NET.seq;
    if(NET.pred&&V.phase==='play'){ Sim.moveHuman(V,NET.pred,inp,dt); NET.pending.push({...inp}); while(NET.pending.length>120) NET.pending.shift(); }
    NET.sent.set(inp.seq,performance.now()); if(NET.sent.size>400) NET.sent.delete(NET.sent.keys().next().value);
    ws.send(JSON.stringify(Object.assign({t:'in'},inp)));
    interpActors(); predictFire(dt,me());
  }
  if(V&&V.phase!==lastPhase){ if(V.phase==='play'){ show('hud',true); if(!AUTOTEST) lock(); toolsKey=''; if(lastPhase!=='play'){ const m=me(); if(m){ LOOK.yaw=m.yaw; LOOK.pitch=0; } } } else { show('hud',false); atualizarMarcas(null); unlock(); AV.forEach((O,i)=>ritualLoopStop(i)); } lastPhase=V.phase; }
  wasLocked=locked;
  syncScreens();
  // cosmetics
  distribuirLuzes(dt,now); seguirLua(); cortarVegetacao(dt);
  flames.forEach((f,i)=>{ f.scale.y=.26+Math.sin(now*.02+i)*.03; });
  if(RT.dust){ RT.dust.rotation.y+=dt*.004; RT.dust.position.y=Math.sin(now*.0002)*.3; }
  updateParticles(dt); atualizarEfeitos(dt);
  anuncioT=Math.max(0,anuncioT-dt); if(anuncioT<=0) $('#anuncio').classList.remove('on');
  habNotaT=Math.max(0,habNotaT-dt); if(habNotaT<=0) $('#habNota').classList.remove('on');
  atordT=Math.max(0,atordT-dt); $('#atordoado').style.opacity=(atordT*.9).toFixed(2);
  for(let i=tracers.length-1;i>=0;i--){ const tr=tracers[i]; tr.t-=dt; tr.l.material.opacity=Math.max(0,tr.t/.07); if(tr.t<=0){ world.remove(tr.l); descartar(tr.l); tracers.splice(i,1); } }
  const m=V?me():null;
  if(V&&V.phase==='play'&&m){
    syncActors(dt); syncAltars(dt); syncNoite(dt,now/1000);
    const pos=MODE==='online'&&NET.pred?NET.pred:m;
    const s=m.sanity, shake=s<40?(40-s)/40*.012:0, down=m.st==='down';
    const bob=pos.moving?Math.sin(now*.011)*.045:0;
    const suav=MODE==='online'?Math.exp(-dt*14):0; NET.erro.x*=suav; NET.erro.z*=suav;
    camera.position.set(pos.x+NET.erro.x,down?.45:1.65+bob,pos.z+NET.erro.z); // sensação: campo de visão abre na corrida, câmera inclina ao andar de lado, coice volta sozinho
    const I=ULT_INP||{mx:0,mz:0,sp:false}, correndo=I.sp&&I.mz<0&&pos.moving&&m.st==='alive';
    FX.fov=lerp(FX.fov,SET.fov+(correndo?7:0),.1); if(Math.abs(camera.fov-FX.fov)>.05){ camera.fov=FX.fov; camera.updateProjectionMatrix(); }
    FX.roll=lerp(FX.roll,pos.moving&&!down?-I.mx*.022:0,.1); FX.kickP=lerp(FX.kickP,0,.14);
    camera.rotation.set(LOOK.pitch+FX.kickP+rand(-shake,shake),LOOK.yaw+rand(-shake,shake),FX.roll);
    lantern.intensity=m.team==='H'&&m.lantern&&m.st==='alive'?3.2:0;
    muzzle.intensity=Math.max(0,muzzle.intensity-dt*30); vmFlash.material.opacity=Math.max(0,vmFlash.material.opacity-dt*14); 
    VM.k=Math.max(0,VM.k-dt*7); VM.cast=Math.max(0,VM.cast-dt*4);
    VM.sx=lerp(VM.sx,clamp(VM.mdx*.0009,-.05,.05),.2); VM.sy=lerp(VM.sy,clamp(VM.mdy*.0009,-.05,.05),.2); VM.mdx*=.7; VM.mdy*=.7;
    const bt=now*.0105, bx=pos.moving?Math.cos(bt*.5)*.012:0, by=pos.moving?Math.abs(Math.sin(bt*.5))*.014:Math.sin(now*.002)*.003;
    const rl=m.reloadT>0?Math.sin((1-m.reloadT/1.6)*Math.PI):0; VM.spr=lerp(VM.spr,correndo?1:0,.12);
    vmH.position.set(.2-VM.sx+bx+VM.spr*.03,-.17-VM.sy-by-rl*.12-VM.spr*.05,-.42+VM.k*.06);
    vmH.rotation.set(VM.k*.22+rl*.25-VM.spr*.25,VM.spr*.6+VM.sx*2,rl*.9);
    const exo=m.cls==='exorcista', arma=exo?vmRevolver:vmCarabina; vmCarabina.g.visible=!exo; vmRevolver.g.visible=exo;
    vmFlash.position.copy(arma.boca).add(arma.g.position);
    vmC.position.set(.26-VM.sx+bx+VM.spr*.02,-.12-VM.sy-by-VM.spr*.08,-.5-VM.cast*.14); vmC.rotation.set(-.3-VM.cast*.55-VM.spr*.3,VM.sx*1.5,.18+VM.spr*.25);
    const cargas=Math.floor(m.fervor/CFG.sigilCusto), giro=now*.0015*(1+VM.cast*6);
    vmRunas.forEach((r,k)=>{ const on=k<cargas; r.visible=on; const a=giro+k/7*Math.PI*2; r.position.set(Math.cos(a)*.085,.1+Math.sin(a*2+k)*.012,Math.sin(a)*.085); r.material.rotation=a*2; });
    vmOrb.material.opacity=.3+.5*(m.fervor/100)+VM.cast*.5; vmCetro.brasa.scale.setScalar(1+VM.cast*.5+Math.sin(now*.006)*.05); vmCetro.runa.material.rotation+=dt*(1.5+VM.cast*12);
    vmH.visible=m.team==='H'&&m.st==='alive'; vmC.visible=m.team==='C'&&m.st==='alive';
    if(pos.moving&&m.st==='alive'){ stepT-=dt; if(stepT<=0){ stepT=.45; SFX.mystep(); } }
    // sanity fx (client side)
    const k=clamp((70-s)/70,0,1); $('#vignette').style.opacity=k.toFixed(2);
    const blur=s<40?(40-s)/40*1.1:0; renderer.domElement.style.filter=`saturate(${(1-k*.55).toFixed(2)}) contrast(${(1+k*.25).toFixed(2)})${blur>.05?` blur(${blur.toFixed(2)}px)`:''}`;
    if(s<40){ hallT-=dt; if(hallT<=0){ hallT=rand(6,12); const a=rand(0,Math.PI*2); if(Math.random()<.5) SFX.whisper(pos.x+Math.cos(a)*6,pos.z+Math.sin(a)*6,true); else for(let i=0;i<3;i++) setTimeout(()=>sfxNoise(0,0,1,.09,'lowpass',520,.8,.6,true),i*380); } }
    if(s<15){ heartT-=dt; if(heartT<=0){ heartT=.85; SFX.heart(); } }
    bellT-=dt; if(bellT<=0){ bellT=rand(45,80); SFX.bell(); }
    updateHUD(dt,m); atualizarMarcas(m);
  } else {
    $('#vignette').style.opacity=0; renderer.domElement.style.filter='';
    if(vmH){ vmH.visible=false; vmC.visible=false; } // fora da partida, nada de arma na mão
    const a=now*.00004; camera.position.set(6+Math.sin(a)*17,3.4,-4+Math.cos(a)*13); camera.lookAt(6,4.5,-4); camera.rotateY(-.28);
    if(V&&V.altars) syncAltars(dt);
  }
  if(GRADE){ GRADE.uniforms.uTempo.value=(now*.001)%100; const mS=V&&V.phase==='play'?me():null; const san=mS?mS.sanity:100; GRADE.uniforms.uAberr.value=.0012+Math.max(0,(45-san)/45)*.006; }
  if(GRADE&&composer){ GRADE.uniforms.tDepth.value=composer.readBuffer.depthTexture; GRADE.uniforms.uTexel.value.set(1/innerWidth,1/innerHeight); }
  renderer.info.reset(); if(composer) composer.render(); else renderer.render(scene,camera); INFO_QUADRO={chamadas:renderer.info.render.calls,triangulos:renderer.info.render.triangles};
}
function show(id,on){ document.getElementById(id).classList.toggle('on',on); }

// ================= BOOT =================
function boot(){
  buildTextures(); buildTexturasExtras(); buildWorld(); buildFloresta(); const fusao=fundirEstaticos(); buildMarcas(); if(AUTOTEST) window.__fusao=fusao; buildAltars(); buildViewmodels(); buildParticles(); buildStrip();
  applySet(); $('#loading').style.display='none';
  requestAnimationFrame(tick);
  const probe=n=>{ const ctl=new AbortController(); setTimeout(()=>ctl.abort(),8000);
    fetch('/api/info',{cache:'no-store',signal:ctl.signal}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.server==='ritual-reversal'){ ONLINE_OK=true; if(!MODE) screenKey=''; } }).catch(()=>{ if(n>0) setTimeout(()=>probe(n-1),1500); }); };
  probe(2);
  if(AUTOTEST){ window.__T={Sim,get game(){return game;},get V(){return V;},startLocal,sendAct,cena:()=>scene,rend:()=>renderer,malhas:()=>actorMeshes,info:()=>({geometrias:renderer.info.memory.geometries,texturas:renderer.info.memory.textures,chamadas:INFO_QUADRO.chamadas,triangulos:INFO_QUADRO.triangulos,objetos:(()=>{let n=0;scene.traverse(()=>n++);return n;})()}),derrubar:()=>{ if(ws) ws.close(); },get recon(){return RECON.ativo;},get down(){return down;},setBind,SET,C,LOOK,connect,NET,setMouse:v=>mouseL=v,get meCid(){return meCid;}}; }
}
setTimeout(()=>{ try{ boot(); }catch(e){ $('#loading').textContent='Não foi possível iniciar o WebGL neste navegador.'; console.error(e); } },30);
})();
